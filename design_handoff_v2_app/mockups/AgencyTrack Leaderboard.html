<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgencyTrack — Leaderboard mockups</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    #root { height: 100vh; }
    .intro {
      position: fixed; top: 18px; left: 18px; z-index: 50;
      background: #ffffff; border: 1px solid #e5e2db; border-radius: 14px;
      box-shadow: 0 1px 2px rgba(40,37,29,0.04), 0 12px 32px rgba(40,37,29,0.08);
      padding: 14px 18px; max-width: 440px; color: #28251d;
    }
    .intro h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 4px; font-family: 'Cabinet Grotesk', -apple-system, sans-serif; }
    .intro p { font-size: 12px; line-height: 1.5; color: #6b6560; margin: 0; }
    .intro .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #01696F; border-radius: 50%;
      margin-right: 6px; vertical-align: 1px;
    }
  </style>
</head>
<body>
  <div class="intro">
    <h1><span class="dot"></span>Leaderboard — desktop + mobile × light + dark</h1>
    <p>Ports the kiosk's podium treatment (gold/silver/bronze medals, glow halo on #1, period chips) into the app at daily-use scale. 4 artboards.</p>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="app-tokens.jsx"></script>
  <script type="text/babel" src="app-motion.jsx"></script>
  <script type="text/babel" src="app-shell.jsx"></script>
  <script type="text/babel" src="app-mobile.jsx"></script>
  <script type="text/babel" src="app-leaderboard.jsx"></script>

  <script type="text/babel">
    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="desktop"
            title="Desktop — light + dark"
            subtitle="Sidebar + topbar shell. Podium of 3 with #1 elevated + glowing. Tail ranks 4-8 with animated progress bars."
          >
            <DCArtboard id="d-light" label="Light · 1280×800" width={APP_W} height={APP_H}><LeaderboardDesktop t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="d-dark"  label="Dark · 1280×800"  width={APP_W} height={APP_H}><LeaderboardDesktop t={APP_DARK} /></DCArtboard>
          </DCSection>

          <DCSection
            id="mobile"
            title="Mobile — light + dark"
            subtitle="iPhone 390×844. #1 as full-width hero, #2 + #3 side-by-side, tail list below. Same medal grammar as the kiosk."
          >
            <DCArtboard id="m-light" label="Light · 390×844"  width={M_W} height={M_H}><LeaderboardMobile t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="m-dark"  label="Dark · 390×844"   width={M_W} height={M_H}><LeaderboardMobile t={APP_DARK} /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
