<!-- @dsCard group="Brand" viewport="700x190" name="Data conventions" subtitle="TTD currency rule · T&T sample names · ★ live glyph · initials avatars" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink);padding:16px 24px;display:flex;gap:24px}
.k{font-family:var(--mono);font-size:9px;font-weight:700;letter-spacing:.12em;color:var(--ink-faint);margin-bottom:8px}
.r{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid var(--rule-soft);font-size:13px}
.r:last-child{border-bottom:0}
.av{width:26px;height:26px;border-radius:50%;background:var(--teal-tint);color:var(--teal);display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:800;font-size:10px;flex-shrink:0}
.m{font-family:var(--mono);font-weight:700;font-size:12px;margin-left:auto}
</style></head><body>
<div style="flex:1">
  <div class="k">CURRENCY · ttd()</div>
  <div class="r"><span>≥ 1M → 2 decimals</span><span class="m" style="color:var(--teal)">TTD 2.40M</span></div>
  <div class="r"><span>≥ 1K → 1 decimal</span><span class="m" style="color:var(--teal)">TTD 24.5K</span></div>
  <div class="r"><span>else → whole</span><span class="m" style="color:var(--teal)">TTD 950</span></div>
</div>
<div style="flex:1.2">
  <div class="k">SAMPLE DATA · TRINIDAD & TOBAGO</div>
  <div class="r"><span class="av">MS</span><b>Marsha Singh</b><span style="font-family:var(--mono);font-size:10px;color:var(--ink-faint)">TL-08661</span><span class="m">TTD 24K</span></div>
  <div class="r"><span class="av">AP</span><b>Anand Persad</b><span style="font-family:var(--mono);font-size:10px;color:var(--ink-faint)">Tatil Life</span><span class="m">TTD 19K</span></div>
  <div class="r"><span class="av">SM</span><b>Selina Mohammed</b><span style="font-family:var(--mono);font-size:10px;color:var(--gold)">★ MDRT</span><span class="m">TTD 17K</span></div>
</div>
</body></html>
