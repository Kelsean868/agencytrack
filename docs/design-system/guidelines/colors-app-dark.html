<!-- @dsCard group="Colors" viewport="700x175" name="App — dark (warm)" subtitle="#1A1612 ground, brightened teal/gold, alpha hairlines — never blue-black" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--sans)}
.wrap{padding:14px 16px;background:#1A1612}
.row{display:flex;gap:8px}
.row+.row{margin-top:8px}
.sw{flex:1;border-radius:10px;padding:8px 9px 7px;display:flex;flex-direction:column;justify-content:flex-end;height:62px;box-sizing:border-box;border:1px solid rgba(240,235,224,.1)}
.sw b{font-size:10.5px;font-weight:700}
.sw span{font-family:'JetBrains Mono',monospace;font-size:8.5px;opacity:.72;margin-top:1px}
</style></head><body>
<div class="wrap nexus dark">
  <div class="row">
    <div class="sw" style="background:#1A1612;color:#F0EBE0"><b>bg</b><span>#1A1612</span></div>
    <div class="sw" style="background:#252019;color:#F0EBE0"><b>surface</b><span>#252019</span></div>
    <div class="sw" style="background:#302A23;color:#F0EBE0"><b>surfaceRaised</b><span>#302A23</span></div>
    <div class="sw" style="background:#F0EBE0;color:#28251D"><b>ink</b><span>#F0EBE0</span></div>
    <div class="sw" style="background:#B8AEA0;color:#1A1612"><b>inkMute</b><span>#B8AEA0</span></div>
    <div class="sw" style="background:#8A8074;color:#1A1612"><b>inkFaint</b><span>#8A8074</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background:#4AB5B8;color:#1A1612"><b>teal ↑</b><span>#4AB5B8</span></div>
    <div class="sw" style="background:#6FD3D6;color:#1A1612"><b>tealLight</b><span>#6FD3D6</span></div>
    <div class="sw" style="background:rgba(74,181,184,.14);color:#4AB5B8"><b>tealTint</b><span>α .14 wash</span></div>
    <div class="sw" style="background:#E0AA3E;color:#1A1612"><b>gold ↑</b><span>#E0AA3E</span></div>
    <div class="sw" style="background:rgba(224,170,62,.14);color:#E0AA3E"><b>goldTint</b><span>α .14 wash</span></div>
    <div class="sw" style="background:rgba(240,235,224,.08);color:#B8AEA0"><b>rule</b><span>α .08 hairline</span></div>
  </div>
</div>
</body></html>
