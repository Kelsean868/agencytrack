<!-- @dsCard group="Foundations" viewport="700x185" name="Radii & elevation" subtitle="Shadowless at rest — shadow arrives on hover with lift" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink);padding:18px 24px;display:flex;gap:14px;align-items:center}
.b{background:var(--paper);border:1px solid var(--rule);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;width:108px;height:82px;flex-shrink:0}
.b b{font-size:11.5px;font-weight:700}
.b span{font-family:var(--mono);font-size:8.5px;color:var(--ink-faint)}
</style></head><body>
<div class="b" style="border-radius:12px"><b>Button</b><span>11–12px</span></div>
<div class="b" style="border-radius:18px"><b>Card</b><span>14–18px</span></div>
<div class="b" style="border-radius:20px"><b>Panel</b><span>20–22px</span></div>
<div class="b" style="border-radius:999px;width:120px;height:44px;flex-direction:row;gap:8px"><b>Pill</b><span>999px</span></div>
<div class="b" style="border-radius:18px;box-shadow:0 14px 34px rgba(38,35,28,.09);transform:translateY(-4px);border-color:rgba(1,105,111,.3)"><b>Hover</b><span>lift + shadow</span></div>
<div class="b" style="border-radius:12px;background:var(--teal);color:#fff;border:0;box-shadow:0 8px 20px rgba(1,105,111,.28)"><b>CTA shadow</b><span>teal-tinted</span></div>
</body></html>
