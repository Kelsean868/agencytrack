<!-- @dsCard group="Colors" viewport="700x150" name="Brand core" subtitle="Teal = meaning · gold = recognition only" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;padding:16px}
.sw{flex:1;border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:118px;box-sizing:border-box;border:1px solid rgba(0,0,0,.06)}
.sw b{font-size:12.5px;font-weight:700}
.sw span{font-family:var(--mono);font-size:10px;opacity:.75;margin-top:2px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#01696F;color:#fff"><b>Teal</b><span>#01696F · --teal</span></div>
  <div class="sw" style="background:#014E52;color:#fff"><b>Teal deep</b><span>#014E52 · --teal-deep</span></div>
  <div class="sw" style="background:#36BDB9;color:#0E0B07"><b>Teal bright</b><span>#36BDB9 · --teal-bright</span></div>
  <div class="sw" style="background:#B07D1A;color:#fff"><b>Gold</b><span>#B07D1A · --gold</span></div>
  <div class="sw" style="background:#E8B73E;color:#0E0B07"><b>Gold bright</b><span>#E8B73E · --gold-bright</span></div>
  <div class="sw" style="background:#4ECDC4;color:#0E0B07"><b>Logo dot</b><span>#4ECDC4 · --brand-logo-dot</span></div>
</div>
</body></html>
