<!-- @dsCard group="Colors" viewport="700x175" name="App — light" subtitle="Nexus light surfaces, inks, brand tints" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--sans)}
.wrap{padding:14px 16px;background:#F7F6F2}
.row{display:flex;gap:8px}
.row+.row{margin-top:8px}
.sw{flex:1;border-radius:10px;padding:8px 9px 7px;display:flex;flex-direction:column;justify-content:flex-end;height:62px;box-sizing:border-box;border:1px solid rgba(0,0,0,.07)}
.sw b{font-size:10.5px;font-weight:700}
.sw span{font-family:'JetBrains Mono',monospace;font-size:8.5px;opacity:.72;margin-top:1px}
</style></head><body>
<div class="wrap nexus">
  <div class="row">
    <div class="sw" style="background:#F7F6F2"><b>bg</b><span>#F7F6F2</span></div>
    <div class="sw" style="background:#FFFFFF"><b>surface</b><span>#FFFFFF</span></div>
    <div class="sw" style="background:#FAFAF8"><b>surfaceRaised</b><span>#FAFAF8</span></div>
    <div class="sw" style="background:#F4F2EC"><b>surfaceSoft</b><span>#F4F2EC</span></div>
    <div class="sw" style="background:#F0EFE9"><b>surfaceMute</b><span>#F0EFE9</span></div>
    <div class="sw" style="background:#E5E2DB"><b>rule</b><span>#E5E2DB</span></div>
  </div>
  <div class="row">
    <div class="sw" style="background:#28251D;color:#F0EBE0"><b>ink</b><span>#28251D</span></div>
    <div class="sw" style="background:#6B6560;color:#fff"><b>inkMute</b><span>#6B6560</span></div>
    <div class="sw" style="background:#01696F;color:#fff"><b>teal</b><span>#01696F</span></div>
    <div class="sw" style="background:#E6F4F4;color:#01696F"><b>tealTint</b><span>#E6F4F4</span></div>
    <div class="sw" style="background:#B07D1A;color:#fff"><b>gold</b><span>#B07D1A</span></div>
    <div class="sw" style="background:#FAEFD3;color:#8A6010"><b>goldTint</b><span>#FAEFD3</span></div>
  </div>
</div>
</body></html>
