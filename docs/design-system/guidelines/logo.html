<!-- @dsCard group="Brand" viewport="700x185" name="Logo" subtitle="Teal shield tile, rising activity bars, #4ECDC4 dot — never redraw" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--sans);color:var(--ink);display:flex}
.cell{flex:1;display:flex;align-items:center;justify-content:center;gap:12px;padding:24px}
.wm{font-family:var(--display);font-weight:700;letter-spacing:-.02em}
</style></head><body>
<div class="cell" style="background:var(--cream)">
  <img src="../assets/logo-shield.svg" alt="AgencyTrack" width="64" height="64" style="border-radius:14px">
</div>
<div class="cell" style="background:var(--paper);border-left:1px solid var(--rule);border-right:1px solid var(--rule)">
  <img src="../assets/logo-shield.svg" alt="" width="34" height="34" style="border-radius:8px">
  <span class="wm" style="font-size:20px">AgencyTrack</span>
</div>
<div class="cell" style="background:var(--dark);color:#F4EFE3">
  <img src="../assets/logo-shield.svg" alt="" width="34" height="34" style="border-radius:8px">
  <span class="wm" style="font-size:20px">AgencyTrack</span>
</div>
</body></html>
