<!-- @dsCard group="Colors" viewport="700x165" name="Semantic (app only)" subtitle="settled / delivery clock / clawback-NTU · violet for list variety" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;font-family:var(--sans);display:flex}
.half{flex:1;padding:14px 16px;box-sizing:border-box}
.row{display:flex;gap:8px}
.chip{flex:1;border-radius:10px;padding:9px 10px;box-sizing:border-box}
.chip b{font-size:11px;font-weight:700;display:block}
.chip span{font-family:'JetBrains Mono',monospace;font-size:8.5px;opacity:.8}
.lbl{font-family:'JetBrains Mono',monospace;font-size:9px;font-weight:700;letter-spacing:.14em;margin-bottom:9px}
</style></head><body>
<div class="half nexus" style="background:#F7F6F2">
  <div class="lbl" style="color:#6B6560">LIGHT</div>
  <div class="row">
    <div class="chip" style="background:#E8F5EE;color:#2D7A4F"><b>Success</b><span>#2D7A4F · settled, on pace</span></div>
    <div class="chip" style="background:#FEF3E2;color:#B45309"><b>Warning</b><span>#B45309 · at risk, clock</span></div>
    <div class="chip" style="background:#FDE8E7;color:#C0392B"><b>Danger</b><span>#C0392B · clawback, NTU</span></div>
    <div class="chip" style="background:#F0ECFF;color:#5A3FA0"><b>Violet</b><span>#5A3FA0 · list variety</span></div>
  </div>
</div>
<div class="half nexus dark" style="background:#1A1612">
  <div class="lbl" style="color:#B8AEA0">DARK</div>
  <div class="row">
    <div class="chip" style="background:rgba(93,184,118,.14);color:#5DB876"><b>Success</b><span>#5DB876</span></div>
    <div class="chip" style="background:rgba(232,181,62,.14);color:#E8B53E"><b>Warning</b><span>#E8B53E</span></div>
    <div class="chip" style="background:rgba(217,107,93,.14);color:#D96B5D"><b>Danger</b><span>#D96B5D</span></div>
    <div class="chip" style="background:rgba(169,149,224,.14);color:#A995E0"><b>Violet</b><span>#A995E0</span></div>
  </div>
</div>
</body></html>
