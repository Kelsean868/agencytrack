<!-- @dsCard group="Foundations" viewport="700x170" name="Motion & hover" subtitle=".15–.18s ease · lift −1..−4px + shadow · one-shot reveals · no infinite loops" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink);padding:18px 24px;display:flex;gap:14px;align-items:stretch}
.demo{flex:1;background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:14px 16px;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;cursor:pointer}
.demo:hover{transform:translateY(-4px);box-shadow:0 18px 40px rgba(38,35,28,.1);border-color:rgba(1,105,111,.3)}
.demo b{font-size:13.5px}
.demo span{display:block;font-family:var(--mono);font-size:9px;color:var(--ink-faint);margin-top:5px;line-height:1.6}
.btn{align-self:center}
.bar{height:6px;border-radius:99px;background:var(--rule);overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--teal-deep),var(--teal));animation:grow 1.1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes grow{to{width:78%}}
@media(prefers-reduced-motion:reduce){.bar i{animation:none;width:78%}}
</style></head><body>
<div class="demo"><b>Hover me — card lift</b><span>translateY(−4px) + soft shadow<br>+ teal-ish border · .18s ease</span></div>
<button class="ds-btn ds-btn-primary btn">Hover me — CTA</button>
<div class="demo" style="cursor:default"><b>Progress grow</b><span>one-shot cubic ease-out · the only gradient allowed</span><div class="bar"><i></i></div></div>
</body></html>
