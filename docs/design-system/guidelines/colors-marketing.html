<!-- @dsCard group="Colors" viewport="700x150" name="Marketing warm neutrals" subtitle="Cream ground, paper cards, warm inks, #0E0B07 rhythm break" -->
<!DOCTYPE html>
<html><head><meta charset="UTF-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;background:var(--cream);font-family:var(--sans);color:var(--ink)}
.row{display:flex;gap:10px;padding:16px}
.sw{flex:1;border-radius:12px;padding:12px 12px 10px;display:flex;flex-direction:column;justify-content:flex-end;height:118px;box-sizing:border-box;border:1px solid rgba(0,0,0,.07)}
.sw b{font-size:12px;font-weight:700}
.sw span{font-family:var(--mono);font-size:9.5px;opacity:.75;margin-top:2px}
</style></head><body>
<div class="row">
  <div class="sw" style="background:#F4F2EC"><b>Cream</b><span>#F4F2EC · --cream</span></div>
  <div class="sw" style="background:#FFFFFF"><b>Paper</b><span>#FFFFFF · --paper</span></div>
  <div class="sw" style="background:#E5E2DB"><b>Rule</b><span>#E5E2DB · --rule</span></div>
  <div class="sw" style="background:#A8A39C;color:#fff"><b>Ink faint</b><span>#A8A39C · --ink-faint</span></div>
  <div class="sw" style="background:#6B6560;color:#fff"><b>Ink mute</b><span>#6B6560 · --ink-mute</span></div>
  <div class="sw" style="background:#26231C;color:#F4F2EC"><b>Ink</b><span>#26231C · --ink</span></div>
  <div class="sw" style="background:#0E0B07;color:#B5AB9C"><b>Dark break</b><span>#0E0B07 · --dark</span></div>
</div>
</body></html>
