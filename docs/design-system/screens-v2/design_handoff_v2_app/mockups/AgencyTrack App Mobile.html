<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgencyTrack — Mobile App Mockups</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    #root { height: 100vh; }
    .intro {
      position: fixed; top: 18px; left: 18px; z-index: 50;
      background: #ffffff; border: 1px solid #e5e2db; border-radius: 14px;
      box-shadow: 0 1px 2px rgba(40,37,29,0.04), 0 12px 32px rgba(40,37,29,0.08);
      padding: 14px 18px; max-width: 440px; color: #28251d;
    }
    .intro h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 4px; font-family: 'Cabinet Grotesk', -apple-system, sans-serif; }
    .intro p { font-size: 12px; line-height: 1.5; color: #6b6560; margin: 0; }
    .intro .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #01696F; border-radius: 50%;
      margin-right: 6px; vertical-align: 1px;
    }
  </style>
</head>
<body>
  <div class="intro">
    <h1><span class="dot"></span>Mobile mockups — light + dark</h1>
    <p>Same 5 screens as the desktop layout, reflowed for 390×844 (iPhone). Bottom nav with Submit FAB, status bar chrome, single-column content. MasterSheet on mobile becomes a card list (tables don't fit narrow viewports).</p>
  </div>

  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="app-tokens.jsx"></script>
  <script type="text/babel" src="app-motion.jsx"></script>
  <script type="text/babel" src="app-shell.jsx"></script>
  <script type="text/babel" src="app-mobile.jsx"></script>

  <script type="text/babel">
    const W = M_W, H = M_H;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="light"
            title="Light mode — default"
            subtitle="Warm cream surface, teal primary, light status bar text. The everyday experience."
          >
            <DCArtboard id="light-m-agent"    label="01 · Agent Dashboard"  width={W} height={H}><MAgentDashboard t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="light-m-lookahead"label="02 · Looking Ahead"    width={W} height={H}><MLookingAhead t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="light-m-money"    label="03 · Money Needs"      width={W} height={H}><MMoneyNeeds t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="light-m-manager"  label="04 · Manager Dashboard"width={W} height={H}><MManagerDashboard t={APP_LIGHT} /></DCArtboard>
            <DCArtboard id="light-m-master"   label="05 · Master Sheet"     width={W} height={H}><MMasterSheet t={APP_LIGHT} /></DCArtboard>
          </DCSection>

          <DCSection
            id="dark"
            title="Dark mode — optional"
            subtitle="Warm near-black surface, lifted teal, same IA. Optional theme."
          >
            <DCArtboard id="dark-m-agent"    label="01 · Agent Dashboard"  width={W} height={H}><MAgentDashboard t={APP_DARK} /></DCArtboard>
            <DCArtboard id="dark-m-lookahead"label="02 · Looking Ahead"    width={W} height={H}><MLookingAhead t={APP_DARK} /></DCArtboard>
            <DCArtboard id="dark-m-money"    label="03 · Money Needs"      width={W} height={H}><MMoneyNeeds t={APP_DARK} /></DCArtboard>
            <DCArtboard id="dark-m-manager"  label="04 · Manager Dashboard"width={W} height={H}><MManagerDashboard t={APP_DARK} /></DCArtboard>
            <DCArtboard id="dark-m-master"   label="05 · Master Sheet"     width={W} height={H}><MMasterSheet t={APP_DARK} /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
