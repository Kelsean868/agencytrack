<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AgencyTrack — Branch Performance Report</title>
  <style>
    html, body { margin: 0; padding: 0; height: 100%; background: #f0eee9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
    #root { height: 100vh; }
    .intro {
      position: fixed;
      top: 18px;
      left: 18px;
      z-index: 50;
      background: #ffffff;
      border: 1px solid #e5e2db;
      border-radius: 14px;
      box-shadow: 0 1px 2px rgba(40,37,29,0.04), 0 12px 32px rgba(40,37,29,0.08);
      padding: 14px 18px;
      max-width: 440px;
      font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
      color: #28251d;
    }
    .intro h1 { font-size: 14px; font-weight: 700; letter-spacing: -0.015em; margin: 0 0 4px; }
    .intro p { font-size: 12px; line-height: 1.5; color: #6b6560; margin: 0; }
    .intro .dot {
      display: inline-block; width: 8px; height: 8px;
      background: #01696F; border-radius: 50%;
      margin-right: 6px; vertical-align: 1px;
    }
  </style>
</head>
<body>
  <div class="intro">
    <h1><span class="dot"></span>AgencyTrack — Branch Performance Report</h1>
    <p>The current export is a raw CSV — fine for spreadsheet work, useless to hand a regional director. Refined as a 4-page PDF (cover + branch totals + agent roster + compliance / top / at-risk). The CSV can still ship alongside for data wonks.</p>
  </div>

  <div id="root"></div>

  <!-- React + Babel -->
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- Design canvas + PDF modules -->
  <script type="text/babel" src="design-canvas.jsx"></script>
  <script type="text/babel" src="pdf-shared.jsx"></script>
  <script type="text/babel" src="pdf-refined-cover.jsx"></script>
  <script type="text/babel" src="pdf-branch.jsx"></script>

  <script type="text/babel">
    const W = 595, H = 842;

    function App() {
      return (
        <DesignCanvas>
          <DCSection
            id="refined-branch"
            title="Refined — Branch Performance Report"
            subtitle="Cover + 3 pages. Replaces the raw CSV with a proper end-of-quarter document a branch manager can hand to upline."
          >
            <DCArtboard id="brn-cover" label="01 · Cover"          width={W} height={H}><BranchCover /></DCArtboard>
            <DCArtboard id="brn-p2"    label="02 · Branch totals"  width={W} height={H}><BranchPage2 /></DCArtboard>
            <DCArtboard id="brn-p3"    label="03 · Agent roster"   width={W} height={H}><BranchPage3 /></DCArtboard>
            <DCArtboard id="brn-p4"    label="04 · Compliance"     width={W} height={H}><BranchPage4 /></DCArtboard>
          </DCSection>

          <DCSection
            id="current-csv"
            title="Current — Raw CSV export"
            subtitle="What exportBranchCSV() ships today. 15 columns, 28 rows, no narrative."
          >
            <DCArtboard id="cur-csv" label="AgencyTrack_Branch_Report_….csv" width={W} height={H}><CurrentCsv /></DCArtboard>
          </DCSection>
        </DesignCanvas>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
