<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgencyTrack — OG Image</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,600,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0a2226}
  .og{
    position:relative;width:1200px;height:630px;overflow:hidden;
    font-family:'Satoshi',sans-serif;
    background:
      radial-gradient(680px 520px at 16% 8%, rgba(74,181,184,0.34), rgba(74,181,184,0) 60%),
      linear-gradient(180deg, #016066 0%, #014147 46%, #012a2f 100%);
  }
  /* faint grid texture for "glass hero" depth */
  .og .texture{position:absolute;inset:0;opacity:0.05;
    background-image:linear-gradient(rgba(247,246,242,.6) 1px, transparent 1px),linear-gradient(90deg, rgba(247,246,242,.6) 1px, transparent 1px);
    background-size:48px 48px;mask-image:radial-gradient(900px 600px at 30% 20%, #000 0%, transparent 75%);-webkit-mask-image:radial-gradient(900px 600px at 30% 20%, #000 0%, transparent 75%)}
  .og .softglow{position:absolute;top:-180px;left:-160px;width:620px;height:620px;border-radius:50%;
    background:radial-gradient(circle, rgba(74,181,184,0.30), rgba(74,181,184,0) 68%);filter:blur(8px)}

  /* ── brand lockup ── */
  .brand{position:absolute;top:54px;left:64px;display:flex;align-items:center;gap:16px}
  .brand .logo{width:56px;height:56px;display:block}
  .brand .wm{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.01em;color:#f7f6f2}

  /* ── left column ── */
  .left{position:absolute;left:64px;top:170px;width:640px}
  .left h1{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:52px;line-height:1.07;letter-spacing:-.03em;color:#f7f6f2}
  .left h1 .em{color:#4ab5b8}
  .left h1 br{display:block}
  .left p{font-family:'Satoshi',sans-serif;font-weight:500;font-size:24px;line-height:1.35;color:rgba(247,246,242,0.85);margin-top:30px;max-width:500px}

  .pill{position:absolute;left:64px;bottom:56px;display:inline-flex;align-items:center;gap:10px;
    background:rgba(247,246,242,0.08);border:1px solid rgba(247,246,242,0.16);border-radius:999px;padding:10px 18px}
  .pill .dot{width:9px;height:9px;border-radius:50%;background:#4ab5b8;box-shadow:0 0 10px rgba(74,181,184,.8)}
  .pill span{font-family:'Satoshi',sans-serif;font-weight:600;font-size:15px;color:rgba(247,246,242,0.92);letter-spacing:.01em}

  /* ── frosted glass card ── */
  .card{position:absolute;right:64px;top:96px;width:404px;
    background:rgba(247,246,242,0.10);border:1px solid rgba(255,255,255,0.22);border-radius:26px;
    padding:30px 30px 28px;backdrop-filter:blur(2px);
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.28), inset 0 0 60px rgba(74,181,184,0.06)}
  .card .mdrt{position:absolute;top:22px;right:22px;display:inline-flex;align-items:center;gap:5px;
    background:rgba(224,170,62,0.18);border:1px solid rgba(224,170,62,0.5);border-radius:999px;padding:5px 11px;
    font-family:'Satoshi',sans-serif;font-weight:700;font-size:12.5px;letter-spacing:.05em;color:#f0c878}
  .card .label{font-family:'Satoshi',sans-serif;font-weight:700;font-size:13px;letter-spacing:.14em;color:#4ab5b8;text-transform:uppercase}
  .card .value{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:62px;line-height:1;letter-spacing:-.03em;color:#ffffff;margin-top:14px}
  .card .value small{font-size:30px;font-weight:800;color:rgba(255,255,255,0.7);letter-spacing:-.02em}
  .track{height:14px;border-radius:999px;background:rgba(247,246,242,0.14);margin-top:26px;overflow:hidden;border:1px solid rgba(255,255,255,0.08)}
  .track i{display:block;height:100%;width:81%;border-radius:999px;
    background:linear-gradient(90deg,#3a9ea2,#4ab5b8 70%,#6fd0d3)}
  .card .cap{font-family:'Satoshi',sans-serif;font-weight:500;font-size:15px;color:rgba(247,246,242,0.78);margin-top:14px}
  .card .divider{height:1px;background:rgba(247,246,242,0.14);margin:24px 0}
  .ministats{display:flex;gap:14px}
  .ministats .ms{flex:1}
  .ministats .ms .mk{font-family:'Satoshi',sans-serif;font-weight:700;font-size:11.5px;letter-spacing:.1em;color:rgba(247,246,242,0.55);text-transform:uppercase}
  .ministats .ms .mv{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:30px;letter-spacing:-.02em;color:#f7f6f2;margin-top:4px}
  .ministats .ms .mv .u{font-size:17px;font-weight:700;color:rgba(247,246,242,0.6)}
</style>
</head>
<body>
  <div class="og" id="og">
    <div class="texture"></div>
    <div class="softglow"></div>

    <div class="brand">
      <svg class="logo" viewBox="0 0 200 200" aria-label="AgencyTrack">
        <defs>
          <linearGradient id="sh" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
            <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.12"/>
            <stop offset="1" stop-color="#ffffff" stop-opacity="0.05"/>
          </linearGradient>
          <clipPath id="cl"><path d="M100 28 Q65 28 37 42 Q30 45 30 56 L30 115 Q30 160 100 188 Q170 160 170 115 L170 56 Q170 45 163 42 Q135 28 100 28 Z"/></clipPath>
        </defs>
        <path d="M100 28 Q65 28 37 42 Q30 45 30 56 L30 115 Q30 160 100 188 Q170 160 170 115 L170 56 Q170 45 163 42 Q135 28 100 28 Z" fill="url(#sh)" stroke="#ffffff" stroke-opacity="0.6" stroke-width="2.5"/>
        <g clip-path="url(#cl)"><rect x="40" y="6" width="40" height="188" fill="#ffffff" opacity="0.10" transform="rotate(16 100 100)"/></g>
        <rect x="72"  y="127" width="11" height="18" rx="2.5" fill="#ffffff" opacity="0.32"/>
        <rect x="87"  y="117" width="11" height="28" rx="2.5" fill="#ffffff" opacity="0.55"/>
        <rect x="102" y="105" width="11" height="40" rx="2.5" fill="#ffffff" opacity="0.80"/>
        <rect x="117" y="93"  width="11" height="52" rx="2.5" fill="#ffffff"/>
        <circle cx="122.5" cy="86" r="4.5" fill="#4ecdc4"/>
        <polyline points="120,87 122.5,84 125,87" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <span class="wm">AgencyTrack</span>
    </div>

    <div class="left">
      <h1>Turn weekly activity<br />into production.</h1>
      <p>The performance platform for insurance agencies.</p>
    </div>

    <div class="pill"><span class="dot"></span><span>Built in Trinidad &amp; Tobago</span></div>

    <div class="card">
      <div class="mdrt">★ MDRT</div>
      <div class="label">YTD · Settled API</div>
      <div class="value">TTD 487<small>K</small></div>
      <div class="track"><i></i></div>
      <div class="cap">81% of TTD 600K · 5 weeks left</div>
      <div class="divider"></div>
      <div class="ministats">
        <div class="ms"><div class="mk">Persistency</div><div class="mv">88<span class="u">%</span></div></div>
        <div class="ms"><div class="mk">Streak</div><div class="mv">12<span class="u"> wks</span></div></div>
      </div>
    </div>
  </div>
</body>
</html>
