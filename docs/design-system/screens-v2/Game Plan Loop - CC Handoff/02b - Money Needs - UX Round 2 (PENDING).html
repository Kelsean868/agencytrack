<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Money Needs — UX Round 2</title>
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&f[]=cabinet-grotesk@700,800&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#F7F6F2; --surface:#FFFFFF; --surfaceRaised:#FAFAF8; --surfaceSoft:#F4F2EC; --surfaceMute:#F0EFE9;
    --ink:#28251D; --inkMute:#6B6560; --inkFaint:#A8A39C; --inkDim:#CFCBC2;
    --rule:#E5E2DB; --ruleStrong:#CFCBC2;
    --teal:#01696F; --tealLight:#018A91; --tealTint:#E6F4F4;
    --gold:#B07D1A; --goldTint:#FAEFD3;
    --success:#2D7A4F; --successTint:#E8F5EE; --danger:#C0392B;
  }
  .dark{
    --bg:#1A1612; --surface:#252019; --surfaceRaised:#302A23; --surfaceSoft:#1F1B17; --surfaceMute:#1F1B17;
    --ink:#F0EBE0; --inkMute:#B8AEA0; --inkFaint:#8A8074; --inkDim:#4F473E;
    --rule:rgba(240,235,224,0.08); --ruleStrong:rgba(240,235,224,0.18);
    --teal:#4AB5B8; --tealLight:#6FD3D6; --tealTint:rgba(74,181,184,0.14);
    --gold:#E0AA3E; --goldTint:rgba(224,170,62,0.14);
    --success:#5DB876; --successTint:rgba(93,184,118,0.14); --danger:#D96B5D;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:'Satoshi',system-ui,sans-serif;background:#E8E6DF;color:#28251D;-webkit-font-smoothing:antialiased}
  .mono{font-family:'JetBrains Mono',monospace}
  .display{font-family:'Cabinet Grotesk',sans-serif}
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  button{font-family:inherit;cursor:pointer;border:none;background:none}
  .wrap{max-width:1180px;margin:0 auto;padding:30px 26px 90px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:11px;font-weight:700;letter-spacing:.14em;color:#01696F;text-transform:uppercase}
  h1{font-family:'Cabinet Grotesk',sans-serif;font-weight:800;font-size:29px;letter-spacing:-.02em;margin:8px 0 0;line-height:1.12}
  .lede{font-size:14px;color:#5a554e;max-width:780px;line-height:1.55;margin:8px 0 0}
  .lede b{color:#28251D}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:22px 0 20px;padding:11px 14px;background:#fff;border:1px solid #DEDBD3;border-radius:13px;position:sticky;top:12px;z-index:40;box-shadow:0 2px 10px rgba(40,37,29,.05)}
  .tlabel{font-family:'JetBrains Mono',monospace;font-size:9.5px;font-weight:700;letter-spacing:.1em;color:#A8A39C;text-transform:uppercase}
  .tgroup{display:flex;gap:3px;padding:3px;background:#F0EFE9;border-radius:9px}
  .tgroup button{padding:7px 13px;border-radius:7px;font-size:12px;font-weight:700;color:#6B6560}
  .tgroup button.on{background:#fff;color:#01696F;box-shadow:0 1px 3px rgba(40,37,29,.12)}
  .tspacer{flex:1}
  .hint{font-size:11.5px;color:#8A8074}

  .stage{display:flex;justify-content:center}
  .ico{display:block;flex-shrink:0}
  @keyframes routebar{from{transform:scaleX(0)}to{transform:scaleX(1)}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

const ICON = {
  calc:"M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2h-4M8 7h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01",
  spark:"M12 3l1.6 4.6L18 9l-4.4 1.4L12 15l-1.6-4.6L6 9zM5 16l.8 2.2L8 19l-2.2.8L5 22l-.8-2.2L2 19z",
  chev:"M6 9l6 6 6-6", x:"M18 6 6 18M6 6l12 12", plus:"M12 5v14M5 12h14",
  trash:"M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6",
  check:"M20 6 9 17l-5-5", pencil:"M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z",
  receipt:"M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1V2l-2 1-2-1-2 1-2-1-2 1-2-1zM8 7h8M8 11h8M8 15h5",
  wallet:"M3 7a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2zM16 12h.01M3 9h18",
};
function Icon({d,size=16,sw=2,color="currentColor",style}){
  return <svg className="ico" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" style={style}>
    {d.split('M').filter(Boolean).map((s,i)=><path key={i} d={'M'+s}/>)}
  </svg>;
}
const fmt = n => 'TTD ' + Number(n).toLocaleString('en-US');
const FREQ = {M:'Monthly',Q:'Quarterly',S:'Semi-Annual',A:'Annual'};
const ann = (a,f)=>{a=+a||0;return f==='M'?a*12:f==='Q'?a*4:f==='S'?a*2:a;};

// ── sample worksheet ──
const GROUPS = [
  { key:'fixed', label:'Fixed Expenses', dot:'var(--teal)',
    calc:[], manual:[{id:'a',label:'Mortgage / rent',amt:6500,f:'M'},{id:'b',label:'Insurance premiums',amt:1200,f:'Q'}] },
  { key:'living', label:'Living Expenses', dot:'var(--inkMute)',
    calc:[{id:'c',label:'Vehicle — personal share (38%)',calcId:'carExpenses',amt:5700,over:false}],
    manual:[{id:'d',label:'Groceries & household',amt:3200,f:'M'}] },
  { key:'business', label:'Business Expenses', dot:'var(--gold)',
    calc:[{id:'e',label:'Professional / industry expenses',calcId:'insuranceIndustry',amt:4800,over:false},
          {id:'f',label:'Vehicle — business share (62%)',calcId:'carExpenses',amt:0,over:false}],
    manual:[{id:'g',label:'Office rent & utilities',amt:1500,f:'M'}] },
  { key:'savings', label:'Savings & Accumulation', dot:'var(--success)',
    calc:[{id:'h',label:'Debt reduction (non-mortgage)',calcId:'loansDebt',amt:0,over:false}], manual:[] },
  { key:'misc', label:'Miscellaneous', dot:'var(--inkFaint)', calc:[], manual:[] },
];
const groupTotal = g => g.calc.reduce((s,i)=>s+ann(i.amt,'A'),0) + g.manual.reduce((s,i)=>s+ann(i.amt,i.f),0);
const groupFilled = g => [...g.calc,...g.manual].filter(i=>i.amt>0).length;

// ════════════════ FIX 3 — a reusable, visually-separated SECTION HEADER ════════════════
function FieldSection({ icon, label, hint, tone='neutral', children, count }) {
  const accent = tone==='calc' ? 'var(--teal)' : 'var(--inkMute)';
  const tint   = tone==='calc' ? 'var(--tealTint)' : 'var(--surfaceMute)';
  return (
    <div style={{ marginTop:14 }}>
      <div style={{ display:'flex', alignItems:'center', gap:9, padding:'7px 11px', background:tint, borderRadius:9, marginBottom:10 }}>
        <Icon d={icon} size={13} color={accent} sw={2.2} />
        <span style={{ fontSize:11, fontWeight:700, textTransform:'uppercase', letterSpacing:'.06em', color:accent }}>{label}</span>
        {count!=null && <span className="mono" style={{ fontSize:9.5, color:'var(--inkFaint)' }}>{count}</span>}
        {hint && <span style={{ marginLeft:'auto', fontSize:10.5, color:'var(--inkFaint)' }}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

// calc-fed card (carries the row fix already shipped)
function CalcRow({ item, onOpen }) {
  const filled = item.amt > 0;
  return (
    <div style={{ border:'1px solid '+(filled?'var(--rule)':'var(--teal)'), background:filled?'var(--surface)':'var(--tealTint)', borderRadius:12, padding:'11px 13px', marginBottom:8 }}>
      <div style={{ display:'flex', alignItems:'flex-start', gap:8, marginBottom:filled?9:10 }}>
        <span style={{ flex:1, minWidth:0, fontSize:13.5, fontWeight:600, color:'var(--ink)', lineHeight:1.35, textWrap:'pretty' }}>{item.label}</span>
        <span style={{ flexShrink:0, display:'inline-flex', alignItems:'center', gap:3, fontSize:9, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', padding:'3px 7px', borderRadius:999, background:item.over?'var(--goldTint)':'var(--tealTint)', color:item.over?'var(--gold)':'var(--teal)' }}>
          <Icon d={ICON.spark} size={10} />{item.over?'Edited':'Calculator'}
        </span>
      </div>
      {filled ? (
        <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <div style={{ display:'flex', alignItems:'baseline', gap:6, flex:'1 1 auto' }}>
            <span className="mono" style={{ width:104, height:44, display:'flex', alignItems:'center', justifyContent:'flex-end', padding:'0 9px', borderRadius:9, border:'1px solid var(--ruleStrong)', background:'var(--surface)', fontWeight:700, fontSize:14, color:'var(--ink)' }}>{Number(item.amt).toLocaleString()}</span>
            <span className="mono" style={{ fontSize:12, color:'var(--inkMute)' }}>{fmt(ann(item.amt,'A'))}/yr</span>
          </div>
          <button onClick={onOpen} style={{ display:'inline-flex', alignItems:'center', gap:6, height:44, padding:'0 13px', borderRadius:9, border:'1px solid var(--teal)', color:'var(--teal)', fontSize:12.5, fontWeight:700 }}><Icon d={ICON.calc} size={13}/>Recalculate</button>
        </div>
      ) : (
        <button onClick={onOpen} style={{ width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8, minHeight:48, borderRadius:10, background:'var(--teal)', color:'#fff', fontSize:14, fontWeight:700, boxShadow:'0 3px 10px color-mix(in srgb,var(--teal) 40%,transparent)' }}><Icon d={ICON.calc} size={16} color="#fff"/>Build with calculator →</button>
      )}
    </div>
  );
}
function ManualRow({ item }) {
  return (
    <div style={{ border:'1px solid var(--ruleStrong)', background:'var(--surface)', borderRadius:11, padding:'10px 12px', marginBottom:8, boxShadow:'0 1px 2px rgba(40,37,29,.04)' }}>
      <input defaultValue={item.label} placeholder="Name this expense" style={{ width:'100%', height:40, padding:'0 10px', borderRadius:8, border:'1px solid transparent', background:'var(--surfaceMute)', color:'var(--ink)', fontSize:13.5, fontWeight:600, marginBottom:8 }}/>
      <div style={{ display:'flex', alignItems:'center', gap:8 }}>
        <input defaultValue={item.amt} className="mono" style={{ width:96, height:44, padding:'0 9px', borderRadius:9, border:'1px solid var(--rule)', background:'var(--surface)', color:'var(--ink)', fontSize:13.5, textAlign:'right' }}/>
        <select defaultValue={item.f} style={{ flex:1, minWidth:0, height:44, padding:'0 8px', borderRadius:9, border:'1px solid var(--rule)', background:'var(--surface)', color:'var(--ink)', fontSize:13 }}>{Object.entries(FREQ).map(([k,v])=><option key={k}>{v}</option>)}</select>
        <span className="mono" style={{ fontSize:11, color:'var(--inkMute)', whiteSpace:'nowrap' }}>{fmt(ann(item.amt,item.f))}/yr</span>
        <button style={{ width:40, height:44, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--inkMute)', borderRadius:9 }}><Icon d={ICON.trash} size={15}/></button>
      </div>
    </div>
  );
}

// ════════════════ FIX 2 — single-open accordion (open state lifted to parent) ════════════════
function Accordion({ g, open, onToggle, onOpenCalc }) {
  const total = groupTotal(g), filled = groupFilled(g), all = g.calc.length + g.manual.length;
  return (
    <div style={{ border:'1px solid var(--rule)', borderRadius:12, overflow:'hidden', background:'var(--surface)', marginBottom:8, transition:'box-shadow .15s', boxShadow: open?'0 4px 16px rgba(40,37,29,.07)':'none' }}>
      <button onClick={onToggle} style={{ width:'100%', display:'flex', alignItems:'center', gap:9, padding:'0 14px', minHeight:52, textAlign:'left' }}>
        <span style={{ width:9, height:9, borderRadius:2, background:g.dot, flexShrink:0 }}></span>
        <span style={{ flex:1, minWidth:0, fontSize:14, fontWeight:700, color:'var(--ink)' }}>{g.label}</span>
        {all>0 && <span className="mono" style={{ fontSize:10, color:'var(--inkMute)', flexShrink:0 }}>{filled} of {all}</span>}
        {total>0 && <span className="mono" style={{ fontSize:11.5, color:'var(--inkMute)', flexShrink:0 }}>{fmt(total)}/yr</span>}
        <Icon d={ICON.chev} size={16} color="var(--inkMute)" style={{ flexShrink:0, transform:open?'rotate(180deg)':'none', transition:'transform .2s' }}/>
      </button>
      {open && (
        <div style={{ padding:'2px 14px 16px', borderTop:'1px solid var(--rule)' }}>
          {g.calc.length>0 && (
            <FieldSection icon={ICON.spark} label="From your calculators" tone="calc" hint="prefilled — tap to build">
              {g.calc.map(it=><CalcRow key={it.id} item={it} onOpen={()=>onOpenCalc(it.calcId)}/>)}
            </FieldSection>
          )}
          <FieldSection icon={ICON.pencil} label="Your entries" tone="neutral" count={g.manual.length?`${g.manual.length} item${g.manual.length>1?'s':''}`:null}>
            {g.manual.length===0 ? <p style={{ fontSize:12.5, color:'var(--inkMute)', padding:'4px 0' }}>No items yet. Add your first below.</p> : g.manual.map(it=><ManualRow key={it.id} item={it}/>)}
            <button style={{ display:'inline-flex', alignItems:'center', gap:6, height:44, marginTop:10, padding:'0 13px', borderRadius:9, border:'1px dashed color-mix(in srgb,var(--teal) 50%,transparent)', color:'var(--teal)', fontSize:12.5, fontWeight:700 }}><Icon d={ICON.plus} size={13}/>Add item</button>
          </FieldSection>
        </div>
      )}
    </div>
  );
}

// ════════════════ FIX 1 — calculator modal WITH a sticky Done footer ════════════════
const CALC_META = {
  insuranceIndustry:{ title:'Insurance Industry Expenses', prefill:'“Professional / industry expenses” in Business Expenses', icon:ICON.receipt },
  carExpenses:{ title:'Car Expenses', prefill:'split across Living (38%) + Business (62%)', icon:ICON.wallet },
  loansDebt:{ title:'Loans & Debt', prefill:'“Debt reduction (non-mortgage)” in Savings & Accumulation', icon:ICON.wallet },
};
function CalcModal({ calcId, mobile, onClose }) {
  const meta = CALC_META[calcId] || CALC_META.insuranceIndustry;
  const [items,setItems] = useState([
    { id:1, label:'License renewal', amt:1000, f:'A' },
    { id:2, label:'CPD / training', amt:300, f:'Q' },
  ]);
  const total = items.reduce((s,i)=>s+ann(i.amt,i.f),0);
  const add = ()=> setItems(p=>[...p,{id:Date.now(),label:'',amt:0,f:'M'}]);
  return (
    <div onClick={onClose} style={{ position:'absolute', inset:0, zIndex:60, display:'flex', alignItems:mobile?'flex-end':'center', justifyContent:'center', background:'rgba(0,0,0,.42)', backdropFilter:'blur(3px)', padding:mobile?0:16 }}>
      <div onClick={e=>e.stopPropagation()} style={{ width:mobile?'100%':460, maxWidth:'100%', maxHeight:mobile?'90%':'88%', display:'flex', flexDirection:'column', background:'var(--surfaceRaised)', border:'1px solid var(--rule)', borderRadius:mobile?'20px 20px 0 0':16, overflow:'hidden', boxShadow:'0 24px 60px rgba(0,0,0,.32)' }}>
        {/* header */}
        <div style={{ display:'flex', alignItems:'center', gap:11, padding:'14px 16px', borderBottom:'1px solid var(--rule)', flexShrink:0 }}>
          <span style={{ width:34, height:34, borderRadius:9, background:'var(--tealTint)', color:'var(--teal)', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0 }}><Icon d={meta.icon} size={17} color="var(--teal)"/></span>
          <span style={{ flex:1, minWidth:0 }}>
            <span className="display" style={{ display:'block', fontSize:16, fontWeight:800, letterSpacing:'-.01em', color:'var(--ink)' }}>{meta.title}</span>
            <span style={{ fontSize:11, color:'var(--inkMute)' }}>Prefills {meta.prefill}</span>
          </span>
          <button onClick={onClose} aria-label="Close" style={{ width:44, height:44, display:'flex', alignItems:'center', justifyContent:'center', borderRadius:11, color:'var(--inkMute)', flexShrink:0 }}><Icon d={ICON.x} size={18}/></button>
        </div>
        {/* body */}
        <div style={{ padding:16, overflowY:'auto', flex:1 }}>
          <FieldSection icon={ICON.pencil} label="Line items" tone="neutral" count={`${items.length}`}>
            {items.map(it=>(
              <div key={it.id} style={{ border:'1px solid var(--ruleStrong)', background:'var(--surface)', borderRadius:11, padding:'10px 12px', marginBottom:8, boxShadow:'0 1px 2px rgba(40,37,29,.04)' }}>
                <input defaultValue={it.label} placeholder="Name this item" style={{ width:'100%', height:40, padding:'0 10px', borderRadius:8, border:'1px solid transparent', background:'var(--surfaceMute)', color:'var(--ink)', fontSize:13.5, fontWeight:600, marginBottom:8 }}/>
                <div style={{ display:'flex', alignItems:'center', gap:8 }}>
                  <input defaultValue={it.amt||''} placeholder="0" className="mono" style={{ width:90, height:44, padding:'0 9px', borderRadius:9, border:'1px solid var(--rule)', background:'var(--surface)', color:'var(--ink)', fontSize:13.5, textAlign:'right' }}/>
                  <select defaultValue={it.f} style={{ flex:1, minWidth:0, height:44, padding:'0 8px', borderRadius:9, border:'1px solid var(--rule)', background:'var(--surface)', color:'var(--ink)', fontSize:13 }}>{Object.entries(FREQ).map(([k,v])=><option key={k}>{v}</option>)}</select>
                  <span className="mono" style={{ fontSize:11, color:'var(--inkMute)', whiteSpace:'nowrap' }}>{fmt(ann(it.amt,it.f))}/yr</span>
                  <button onClick={()=>setItems(p=>p.filter(x=>x.id!==it.id))} style={{ width:40, height:44, display:'flex', alignItems:'center', justifyContent:'center', color:'var(--inkMute)', borderRadius:9 }}><Icon d={ICON.trash} size={15}/></button>
                </div>
              </div>
            ))}
            <button onClick={add} style={{ display:'inline-flex', alignItems:'center', gap:6, height:44, marginTop:10, padding:'0 13px', borderRadius:9, border:'1px dashed color-mix(in srgb,var(--teal) 50%,transparent)', color:'var(--teal)', fontSize:12.5, fontWeight:700 }}><Icon d={ICON.plus} size={13}/>Add item</button>
          </FieldSection>
        </div>
        {/* FIX 1 — sticky footer: live total + autosave reassurance + Done */}
        <div style={{ flexShrink:0, borderTop:'1px solid var(--rule)', background:'var(--surface)', padding:'12px 16px' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, marginBottom:9 }}>
            <span style={{ display:'flex', flexDirection:'column' }}>
              <span style={{ fontSize:10.5, color:'var(--inkFaint)', textTransform:'uppercase', letterSpacing:'.05em', fontWeight:700 }} className="mono">Annual total</span>
              <span className="display" style={{ fontSize:20, fontWeight:800, color:'var(--ink)', letterSpacing:'-.02em' }}>{fmt(total)}</span>
            </span>
            <button onClick={onClose} style={{ display:'inline-flex', alignItems:'center', gap:8, height:48, padding:'0 22px', borderRadius:11, background:'var(--teal)', color:'#fff', fontSize:14, fontWeight:700, boxShadow:'0 3px 10px color-mix(in srgb,var(--teal) 40%,transparent)' }}>
              <Icon d={ICON.check} size={16} color="#fff" sw={2.4}/>Done — use this figure
            </button>
          </div>
          <p style={{ margin:0, fontSize:10.5, color:'var(--inkFaint)', display:'flex', alignItems:'center', gap:5 }}>
            <Icon d={ICON.check} size={11} color="var(--success)" sw={2.5}/> Saved automatically as you type · Done closes and fills the field
          </p>
        </div>
      </div>
    </div>
  );
}

// ── panel shell ──
// ── Commission targets + Send-to-Game-Plan flow (tweak 2) ──
function CommissionSend({ mobile, onSend }) {
  return (
    <div style={{ marginTop:14, border:'1px solid var(--rule)', background:'var(--surface)', borderRadius:13, padding:'15px 16px' }}>
      <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10, marginBottom:11 }}>
        <span style={{ fontSize:13.5, fontWeight:700, color:'var(--ink)' }}>1st-year commissions required</span>
        <span className="display" style={{ fontSize:20, fontWeight:800, color:'var(--gold)', letterSpacing:'-.02em' }}>{fmt(184000)}</span>
      </div>
      <button onClick={onSend} style={{ width:'100%', minHeight:48, display:'flex', alignItems:'center', justifyContent:'center', gap:9, borderRadius:11, background:'var(--teal)', color:'#fff', fontSize:14, fontWeight:700, boxShadow:'0 3px 10px color-mix(in srgb,var(--teal) 40%,transparent)' }}>
        <Icon d={ICON.spark} size={15} color="#fff"/>Send to Playground
      </button>
      <p style={{ margin:'9px 0 0', fontSize:10.5, color:'var(--inkFaint)', textAlign:'center' }}>Saves your target to the Commission Playground, then opens Game Plan to build your annual plan.</p>
    </div>
  );
}

// acknowledgement → routing overlay
function SendAck({ stage, mobile, onClose }) {
  return (
    <div style={{ position:'absolute', inset:0, zIndex:70, display:'flex', alignItems:mobile?'flex-end':'center', justifyContent:'center', background:'rgba(0,0,0,.42)', backdropFilter:'blur(3px)', padding:mobile?0:16 }}>
      <div style={{ width:mobile?'100%':360, maxWidth:'100%', background:'var(--surfaceRaised)', border:'1px solid var(--rule)', borderRadius:mobile?'20px 20px 0 0':16, padding:'22px 22px 20px', textAlign:'center', boxShadow:'0 24px 60px rgba(0,0,0,.32)' }}>
        <div style={{ width:54, height:54, borderRadius:'50%', margin:'0 auto 13px', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--successTint)', color:'var(--success)' }}>
          <Icon d={stage==='routing'?ICON.spark:ICON.check} size={26} color="var(--success)" sw={2.4}/>
        </div>
        <div className="display" style={{ fontSize:18, fontWeight:800, letterSpacing:'-.01em', color:'var(--ink)' }}>{stage==='routing'?'Opening Game Plan…':'Target sent'}</div>
        <p style={{ fontSize:12.5, color:'var(--inkMute)', margin:'7px 0 0', lineHeight:1.5 }}>
          {stage==='routing'
            ? <>Taking you to <b style={{color:'var(--ink)'}}>Step 2 · Year Plan</b> to split your target into an annual API plan.</>
            : <>Saved to your Commission Playground (<b style={{color:'var(--ink)'}}>{fmt(184000)}</b>). Next: build your annual plan in Game Plan.</>}
        </p>
        {stage==='routing' && (
          <div style={{ marginTop:15, height:4, borderRadius:99, background:'var(--surfaceMute)', overflow:'hidden' }}>
            <div style={{ height:'100%', width:'100%', background:'var(--teal)', transformOrigin:'left', animation:'routebar 1.1s ease forwards' }}></div>
          </div>
        )}
        {stage==='ack' && (
          <button onClick={onClose} style={{ marginTop:15, width:'100%', minHeight:46, borderRadius:11, background:'var(--teal)', color:'#fff', fontSize:13.5, fontWeight:700, display:'flex', alignItems:'center', justifyContent:'center', gap:8 }}>
            Continue to Game Plan <Icon d="M5 12h14M13 6l6 6-6 6" size={15} color="#fff"/>
          </button>
        )}
      </div>
    </div>
  );
}

// simulated Game Plan landing (shown after routing completes)
function GamePlanLanding({ mobile, onBack }) {
  const steps = [['1','Money Needs','done'],['2','Year Plan','now'],['3','Monthly Plan','todo'],['4','Review & Commit','todo']];
  return (
    <div style={{ padding:mobile?'16px 13px 22px':'22px', background:'var(--bg)', minHeight:mobile?undefined:420 }}>
      <div style={{ fontSize:9.5, fontWeight:700, letterSpacing:'.14em', textTransform:'uppercase', color:'var(--teal)', fontFamily:"'JetBrains Mono',monospace" }}>Game Plan</div>
      <div className="display" style={{ fontSize:mobile?20:24, fontWeight:800, letterSpacing:'-.02em', color:'var(--ink)', marginTop:5 }}>Build your 2026 plan</div>
      <div style={{ display:'flex', alignItems:'center', gap:8, marginTop:6, padding:'8px 12px', background:'var(--successTint)', border:'1px solid color-mix(in srgb,var(--success) 30%,transparent)', borderRadius:10 }}>
        <Icon d={ICON.check} size={14} color="var(--success)" sw={2.4}/>
        <span style={{ fontSize:12, color:'var(--ink)' }}>Money Needs done — <b>{fmt(184000)}</b> commission target carried in.</span>
      </div>
      <p style={{ margin:'10px 2px 0', fontSize:10, color:'var(--inkFaint)', fontStyle:'italic' }}>Illustrative — the real <code style={{fontFamily:"'JetBrains Mono',monospace"}}>game-plan</code> tab renders GamePlanScreen (StepRail + PlanCascade).</p>
      <div style={{ marginTop:14, display:'flex', flexDirection:'column', gap:8 }}>
        {steps.map(([n,label,st])=>(
          <div key={n} style={{ display:'flex', alignItems:'center', gap:11, padding:'12px 14px', borderRadius:11, border:'1px solid '+(st==='now'?'var(--teal)':'var(--rule)'), background:st==='now'?'var(--tealTint)':'var(--surface)' }}>
            <span style={{ width:26, height:26, borderRadius:'50%', flexShrink:0, display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:12, fontFamily:"'JetBrains Mono',monospace", background:st==='done'?'var(--success)':st==='now'?'var(--teal)':'var(--surfaceMute)', color:st==='todo'?'var(--inkMute)':'#fff' }}>{st==='done'?'✓':n}</span>
            <span style={{ flex:1, fontSize:13.5, fontWeight:st==='now'?700:600, color:st==='todo'?'var(--inkMute)':'var(--ink)' }}>{label}</span>
            {st==='now' && <span className="mono" style={{ fontSize:8.5, fontWeight:700, letterSpacing:'.05em', color:'#fff', background:'var(--teal)', padding:'3px 8px', borderRadius:999 }}>START HERE</span>}
          </div>
        ))}
      </div>
      <button onClick={onBack} style={{ marginTop:16, fontSize:12, fontWeight:700, color:'var(--teal)', display:'inline-flex', alignItems:'center', gap:6 }}>← Back to the worksheet (demo)</button>
    </div>
  );
}

// ── panel shell ──
function Panel({ mobile }) {
  const [openGroup,setOpenGroup] = useState('business'); // single-open
  const [calc,setCalc] = useState(null);
  const [send,setSend] = useState('idle'); // idle | ack | routing | landed

  function handleSend(){
    setSend('ack');
  }
  function handleContinue(){
    setSend('routing');
    setTimeout(()=>setSend('landed'), 1150);
  }

  if (send==='landed') return (
    <div style={{ position:'relative', background:'var(--bg)' }}><GamePlanLanding mobile={mobile} onBack={()=>setSend('idle')}/></div>
  );

  return (
    <div style={{ position:'relative', background:'var(--bg)' }}>
      <div style={{ padding:mobile?'16px 13px 22px':'20px 22px 26px' }}>
        <div style={{ display:'flex', alignItems:'center', gap:9, marginBottom:14 }}>
          <Icon d={ICON.calc} size={mobile?18:20} color="var(--teal)"/>
          <span style={{ fontSize:mobile?16:18, fontWeight:700, color:'var(--ink)' }}>Money Needs Worksheet</span>
          <span className="mono" style={{ marginLeft:'auto', fontSize:9.5, fontWeight:700, textTransform:'uppercase', letterSpacing:'.05em', color:'var(--inkMute)', background:'var(--surfaceRaised)', border:'1px solid var(--rule)', borderRadius:999, padding:'3px 8px' }}>Filled 5/9</span>
        </div>
        {GROUPS.map(g=>(
          <Accordion key={g.key} g={g} open={openGroup===g.key} onToggle={()=>setOpenGroup(o=>o===g.key?null:g.key)} onOpenCalc={setCalc}/>
        ))}
        <CommissionSend mobile={mobile} onSend={handleSend}/>
      </div>
      {calc && <CalcModal calcId={calc} mobile={mobile} onClose={()=>setCalc(null)}/>}
      {(send==='ack'||send==='routing') && <SendAck stage={send} mobile={mobile} onClose={handleContinue}/>}
    </div>
  );
}

// ── framed specimen ──
function Specimen({ mobile, theme }) {
  const cls = theme==='dark'?'dark':'';
  if (mobile) return (
    <div className={cls} style={{ width:392, maxWidth:'100%', border:'9px solid #1c1a16', borderRadius:42, overflow:'hidden', boxShadow:'0 16px 40px rgba(40,37,29,.2)', background:'var(--bg)' }}>
      <div style={{ height:30, background:'var(--bg)', display:'flex', alignItems:'center', justifyContent:'center' }}><span style={{ width:116, height:7, borderRadius:99, background:'#1c1a16' }}></span></div>
      <div style={{ maxHeight:720, overflowY:'auto', position:'relative' }}><Panel mobile/></div>
    </div>
  );
  return (
    <div className={cls} style={{ width:'100%', maxWidth:680, border:'1px solid var(--ruleStrong)', borderRadius:16, overflow:'hidden', boxShadow:'0 12px 34px rgba(40,37,29,.12)', background:'var(--bg)' }}>
      <div style={{ display:'flex', alignItems:'center', gap:7, padding:'10px 14px', background:'var(--surfaceRaised)', borderBottom:'1px solid var(--rule)' }}>
        <span style={{ width:10, height:10, borderRadius:'50%', background:'#E5736B' }}></span>
        <span style={{ width:10, height:10, borderRadius:'50%', background:'#E8C15B' }}></span>
        <span style={{ width:10, height:10, borderRadius:'50%', background:'#6DBE7E' }}></span>
        <span className="mono" style={{ marginLeft:8, fontSize:11, color:'var(--inkFaint)' }}>agencytrack · Money Needs</span>
      </div>
      <div style={{ maxHeight:720, overflowY:'auto', position:'relative' }}><Panel/></div>
    </div>
  );
}

function FixCard({ n, title, children }) {
  return (
    <div style={{ display:'flex', gap:12, background:'#fff', border:'1px solid #DEDBD3', borderRadius:12, padding:'14px 15px' }}>
      <span style={{ flexShrink:0, width:24, height:24, borderRadius:7, background:'#E8F5EE', color:'#2D7A4F', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:12 }}>{n}</span>
      <div>{title && <div style={{ fontSize:13.5, fontWeight:700, color:'#28251D', marginBottom:3 }}>{title}</div>}<div style={{ fontSize:12.5, color:'#5a554e', lineHeight:1.5 }}>{children}</div></div>
    </div>
  );
}

function App() {
  const [view,setView] = useState('desktop');
  const [theme,setTheme] = useState('light');
  return (
    <div className="wrap">
      <div className="eyebrow">AgencyTrack · Money Needs · UX round 2</div>
      <h1>Boxed fields, a calculator Done button, and a Send-to-Game-Plan flow.</h1>
      <p className="lede">Usability fixes from real use, accurate to the live <code style={{fontFamily:"'JetBrains Mono',monospace",fontSize:12}}>MoneyNeedsPanel</code>. <b>Toggle desktop / mobile + theme.</b> Open <b>Business Expenses</b> → tap <b>Build with calculator</b> for the Done footer; open another section to watch the others compact; scroll down and tap <b>Send to Playground</b> for the acknowledgement → routing flow.</p>

      <div className="toolbar">
        <span className="tlabel">View</span>
        <div className="tgroup"><button className={view==='desktop'?'on':''} onClick={()=>setView('desktop')}>Desktop</button><button className={view==='mobile'?'on':''} onClick={()=>setView('mobile')}>Mobile</button></div>
        <span className="tlabel" style={{marginLeft:8}}>Theme</span>
        <div className="tgroup"><button className={theme==='light'?'on':''} onClick={()=>setTheme('light')}>Light</button><button className={theme==='dark'?'on':''} onClick={()=>setTheme('dark')}>Dark</button></div>
        <span className="tspacer"></span>
        <span className="hint">open a section · tap “Build with calculator”</span>
      </div>

      <div className="stage"><Specimen mobile={view==='mobile'} theme={theme}/></div>

      <div style={{ marginTop:30 }}>
        <div className="eyebrow" style={{ marginBottom:12 }}>The fixes</div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(248px,1fr))', gap:13 }}>
          <FixCard n="1" title="Done button on every calculator">A sticky footer shows the live <b>annual total</b> and a primary <b>“Done — use this figure”</b> button that closes the calculator and fills the field. A quiet line confirms <b>“saved automatically as you type.”</b> No more guessing whether exiting saved.</FixCard>
          <FixCard n="2" title="One section open at a time">Opening a category now <b>collapses the others</b> (single-open accordion), so the list never grows into an endless scroll. The open card lifts subtly so you always know where you are.</FixCard>
          <FixCard n="3" title="Every field in its own box">Each expense — calc-fed <i>and</i> manual — is its own bordered card with its name as a heading, under a <b>tinted group band</b>. No more undifferentiated wall of inputs.</FixCard>
          <FixCard n="4" title="Send → acknowledge → Game Plan">“Send to Playground” now gives a clear <b>acknowledgement</b> that the target was saved to the Commission Playground, then offers <b>“Continue to Game Plan”</b> — routing via the existing <code style={{fontFamily:"'JetBrains Mono',monospace",fontSize:11}}>onOpenTab('game-plan')</code> tab switch, landing on Step 2 · Year Plan. Replaces the silent 1.5s “Sent!”.</FixCard>
        </div>
        <div style={{ marginTop:13, display:'flex', gap:11, background:'#FBF6EA', border:'1px solid #EAD9AE', borderRadius:12, padding:'13px 15px' }}>
          <span style={{ flexShrink:0, width:24, height:24, borderRadius:7, background:'#FAEFD3', color:'#B07D1A', display:'flex', alignItems:'center', justifyContent:'center', fontWeight:800, fontSize:12 }}>★</span>
          <div style={{ fontSize:12.5, color:'#5a554e', lineHeight:1.5 }}><b style={{ color:'#28251D' }}>Saving behaviour is unchanged</b> — calcs already autosave on blur and write through <span className="mono" style={{ fontSize:11.5 }}>handleSubCalcSaved</span>. Fix 1 only adds the footer + Done affordance. Fix 2 lifts <span className="mono" style={{ fontSize:11.5 }}>open</span> state to the panel. Fix 3 is a presentation wrapper. No data-model change.</div>
        </div>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
