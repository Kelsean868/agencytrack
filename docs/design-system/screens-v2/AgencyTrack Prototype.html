<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AgencyTrack — Redesign Prototype</title>
<link rel="preconnect" href="https://api.fontshare.com" />
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=cabinet-grotesk@700,800,900&display=swap" rel="stylesheet" />
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet" />
<style>
/* ========================= TOKENS ========================= */
.app-root[data-theme="light"]{
  color:#211d17; background:#f2efe8;
  --bg:#f2efe8; --surface:#faf8f3; --card:#fffefb; --card-raised:#ffffff;
  --ink:#211d17; --ink-soft:#6c6357; --ink-faint:#7a7264; --line:#e6e1d7; --line-soft:#efeae1;
  --primary:var(--accent-l); --primary-ink:#ffffff; --primary-soft:color-mix(in oklab, var(--accent-l) 12%, #fffefb);
  --gold:#a97c28; --gold-soft:#f3ead2; --amber:#bd6b1c; --amber-soft:#f8e9d6;
  --hero-a:var(--accent-l); --hero-b:color-mix(in oklab, var(--accent-l) 72%, #0c3f43);
  --hero-ink:#eefbf9; --hero-faint:#a9d9d6; --shadow:0 1px 2px rgba(40,34,26,.05), 0 8px 24px -12px rgba(40,34,26,.14);
  --good:#3c7a4e; --bad:#b0492f;
}
.app-root[data-theme="dark"]{
  color:#f1ece2; background:#171310;
  --bg:#171310; --surface:#201b16; --card:#241f19; --card-raised:#2c261f;
  --ink:#f1ece2; --ink-soft:#b1a89b; --ink-faint:#968b7c; --line:#352e27; --line-soft:#2a241e;
  --primary:var(--accent-d); --primary-ink:#0c1615; --primary-soft:color-mix(in oklab, var(--accent-d) 18%, #241f19);
  --gold:#d7ac59; --gold-soft:#3a3222; --amber:#e0a34a; --amber-soft:#3a2c1a;
  --hero-a:color-mix(in oklab, var(--accent-d) 30%, #0e2b2c); --hero-b:#0c211f;
  --hero-ink:#eafaf8; --hero-faint:#8fc6c3; --shadow:0 1px 2px rgba(0,0,0,.3), 0 10px 30px -14px rgba(0,0,0,.6);
  --good:#63b47c; --bad:#e08063;
}
/* accent options */
.app-root{ --accent-l:#01696f; --accent-d:#4ab5b8; }
.app-root[data-accent="ocean"]{ --accent-l:#1a5f8f; --accent-d:#54a8dd; }
.app-root[data-accent="pine"]{ --accent-l:#2a6a4a; --accent-d:#5cb389; }
/* density */
.app-root[data-density="compact"]{ --pad:14px; --gap:12px; }
.app-root{ --pad:20px; --gap:16px; }

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
.app-root{
  font-family:'Satoshi',system-ui,sans-serif; background:var(--bg); color:var(--ink);
  min-height:100vh; -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
  transition:background .3s ease, color .3s ease;
}
.display{ font-family:'Cabinet Grotesk','Satoshi',sans-serif; }
button{ font-family:inherit; color:inherit; cursor:pointer; }

/* ========================= PRIMITIVES ========================= */
.eyebrow{ font-family:'Space Mono',monospace; font-size:11px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; }
.eyebrow--faint{ color:var(--ink-faint); }
.eyebrow--primary{ color:var(--primary); }
.eyebrow--gold{ color:var(--gold); }
.eyebrow--onhero{ color:var(--hero-faint); }

.ring-wrap{ position:relative; display:inline-grid; place-items:center; flex:none; }
.ring{ transform:rotate(0deg); }
.ring-fill{ transition:stroke-dashoffset .7s cubic-bezier(.22,1,.36,1); }
.ring-center{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
.ring-val{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:14px; line-height:1; color:var(--ink); }
.ring-sub{ font-family:'Space Mono',monospace; font-size:8px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); margin-top:2px; }

.delta{ font-family:'Space Mono',monospace; font-size:11px; font-weight:700; display:inline-flex; gap:3px; align-items:center; }
.delta--up{ color:var(--good); } .delta--down{ color:var(--bad); } .delta--flat{ color:var(--ink-faint); }

.btn{ border:none; border-radius:12px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .12s ease, filter .18s ease, background .18s; white-space:nowrap; }
.btn:active{ transform:translateY(1px); }
.btn--sm{ font-size:13px; padding:8px 14px; } .btn--md{ font-size:14px; padding:11px 18px; } .btn--lg{ font-size:15px; padding:15px 24px; }
.btn--primary{ background:var(--primary); color:var(--primary-ink); }
.btn--primary:hover{ filter:brightness(1.06); }
.btn--amber{ background:var(--amber); color:#2a1c08; }
.btn--amber:hover{ filter:brightness(1.05); }
.btn--ghost-hero{ background:transparent; color:var(--hero-ink); border:1.5px solid rgba(255,255,255,.4); }
.btn--ghost-hero:hover{ background:rgba(255,255,255,.1); }
.btn--ghost{ background:transparent; color:var(--primary); border:1.5px solid var(--line); }

.skel{ background:linear-gradient(90deg,var(--line-soft) 25%,var(--line) 37%,var(--line-soft) 63%); background-size:400% 100%; animation:shimmer 1.4s ease infinite; }
@keyframes shimmer{ 0%{background-position:100% 0} 100%{background-position:0 0} }

.empty{ position:relative; padding:44px 24px; text-align:center; }
.empty-icon{ width:46px; height:46px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; margin:0 auto 14px; }
.empty-title{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:17px; }
.empty-body{ color:var(--ink-soft); font-size:13.5px; max-width:320px; margin:6px auto 16px; line-height:1.5; }

/* ---- ErrorState ---- */
.errstate{ padding:44px 24px; text-align:center; display:flex; flex-direction:column; align-items:center; }
.errstate-icon{ width:46px; height:46px; border-radius:50%; background:color-mix(in oklab, var(--bad) 14%, var(--surface)); color:var(--bad); display:grid; place-items:center; margin-bottom:14px; }
.errstate-title{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:17px; }
.errstate-body{ color:var(--ink-soft); font-size:13.5px; max-width:340px; margin:6px auto 14px; line-height:1.5; }
/* inline field error */
.field-err{ display:flex; align-items:center; gap:6px; color:var(--bad); font-size:12.5px; font-weight:600; margin-top:6px; }
.input.is-err{ border-color:var(--bad); }
/* partial-sync banner */
.sync-banner{ display:flex; align-items:center; gap:10px; padding:11px 14px; border-radius:12px; background:color-mix(in oklab, var(--amber) 12%, var(--surface)); border:1px solid color-mix(in oklab, var(--amber) 34%, var(--line)); color:var(--ink); font-size:13px; font-weight:600; margin-bottom:14px; }
.sync-banner svg{ color:var(--amber); flex:none; }

/* ---- Skeleton layout templates ---- */
.skel-screen{ padding:var(--pad); display:flex; flex-direction:column; gap:16px; }
.skel-toolbar{ display:flex; align-items:center; gap:10px; }
.skel-table{ border:1px solid var(--line); border-radius:14px; overflow:hidden; background:var(--card); }
.skel-tr{ display:flex; align-items:center; gap:18px; padding:15px 18px; }
.skel-tr + .skel-tr{ border-top:1px solid var(--line-soft); }
.skel-th{ background:var(--surface); }
.skel-hero{ padding:22px 24px; border-radius:18px; background:var(--card); border:1px solid var(--line); }
.skel-hero--split{ display:flex; align-items:center; gap:20px; }
.skel-row{ display:flex; align-items:center; gap:14px; padding:14px 16px; border-radius:14px; background:var(--card); border:1px solid var(--line); }
.skel-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.skel-cards--2{ grid-template-columns:repeat(2,1fr); }
.skel-card{ padding:18px; border-radius:16px; background:var(--card); border:1px solid var(--line); }
.app-root[data-view="mobile"] .skel-cards{ grid-template-columns:repeat(2,1fr); }
.app-root[data-view="mobile"] .skel-cards--2{ grid-template-columns:1fr; }

/* ---- Accessibility: focus ring + skip link ---- */
:where(a,button,input,select,textarea,[tabindex],[role="button"],[role="tab"]):focus-visible{
  outline:2.5px solid var(--primary); outline-offset:2px; border-radius:6px;
}
.app-root[data-theme="dark"] :focus-visible{ outline-color:var(--accent-d); }
.skip-link{ position:fixed; top:10px; left:50%; transform:translate(-50%,-160%); z-index:400;
  background:var(--primary); color:var(--primary-ink); font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:13px;
  padding:10px 18px; border-radius:12px; box-shadow:var(--shadow); transition:transform .18s var(--ease-out); border:none; }
.skip-link:focus{ transform:translate(-50%,0); }

/* ---- Motion tokens + screen enter + sheet stagger ---- */
.app-root{ --ease-out:cubic-bezier(.22,1,.36,1); --ease-spring:cubic-bezier(.34,1.56,.64,1); --dur-1:.14s; --dur-2:.2s; --dur-3:.32s; }
@media (prefers-reduced-motion: no-preference){
  .screen-enter{ animation:screenIn .28s var(--ease-out) both; }
  @keyframes screenIn{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
  /* stagger the top-level blocks of a screen so it assembles, not dumps.
     transform-only so a paused/throttled animation degrades to visible (never opacity:0-stuck). */
  .screen-enter .page > *{ animation:cardRise .44s var(--ease-out) both; }
  .screen-enter .page > *:nth-child(1){ animation-delay:.01s; }
  .screen-enter .page > *:nth-child(2){ animation-delay:.05s; }
  .screen-enter .page > *:nth-child(3){ animation-delay:.09s; }
  .screen-enter .page > *:nth-child(4){ animation-delay:.13s; }
  .screen-enter .page > *:nth-child(5){ animation-delay:.17s; }
  .screen-enter .page > *:nth-child(6){ animation-delay:.2s; }
  .screen-enter .page > *:nth-child(n+7){ animation-delay:.23s; }
  @keyframes cardRise{ from{ transform:translateY(12px); } to{ transform:none; } }
  .m-sheet.is-open .m-sheet-sec,
  .m-sheet.is-open .m-create-item{ animation:sheetItemIn .34s var(--ease-out) both; }
  .m-sheet.is-open .m-sheet-sec:nth-child(1){ animation-delay:.02s; }
  .m-sheet.is-open .m-sheet-sec:nth-child(2){ animation-delay:.06s; }
  .m-sheet.is-open .m-sheet-sec:nth-child(3){ animation-delay:.10s; }
  .m-sheet.is-open .m-sheet-sec:nth-child(4){ animation-delay:.14s; }
  .m-sheet.is-open .m-sheet-sec:nth-child(5){ animation-delay:.18s; }
  .m-sheet.is-open .m-sheet-sec:nth-child(n+6){ animation-delay:.22s; }
  .m-sheet.is-open .m-create-item:nth-child(1){ animation-delay:.03s; }
  .m-sheet.is-open .m-create-item:nth-child(2){ animation-delay:.07s; }
  .m-sheet.is-open .m-create-item:nth-child(3){ animation-delay:.11s; }
  .m-sheet.is-open .m-create-item:nth-child(4){ animation-delay:.15s; }
  .m-sheet.is-open .m-create-item:nth-child(n+5){ animation-delay:.19s; }
  @keyframes sheetItemIn{ from{ opacity:0; transform:translateY(10px); } to{ opacity:1; transform:none; } }
}
/* closed sheets: out of the tab order (a11y) */
.m-sheet:not(.is-open){ visibility:hidden; pointer-events:none; }

/* ========================= LOGIN ========================= */
.login{ position:relative; min-height:100vh; display:grid; place-items:center; overflow:hidden; }
.login-motif{ position:absolute; inset:0; overflow:hidden; }
.login-card{ position:relative; width:400px; max-width:92vw; background:var(--card); border:1px solid var(--line); border-radius:24px; padding:34px 34px 26px; box-shadow:var(--shadow); display:flex; flex-direction:column; }
.login-mark{ width:60px; height:60px; border-radius:17px; background:linear-gradient(150deg,var(--hero-a),var(--hero-b)); color:var(--hero-ink); display:grid; place-items:center; margin:0 auto; box-shadow:0 8px 20px -8px color-mix(in oklab,var(--primary) 60%,transparent); }
.login-wordmark{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:30px; text-align:center; margin:6px 0 24px; letter-spacing:-.02em; }
.field-label{ font-size:13px; font-weight:600; color:var(--ink-soft); margin-bottom:7px; }
.input{ width:100%; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:13px 14px; font-size:14.5px; color:var(--ink); font-family:inherit; transition:border .15s; }
.input:focus{ outline:none; border-color:var(--primary); }
.input-wrap{ position:relative; }
.input-affix{ position:absolute; right:6px; top:50%; transform:translateY(-50%); background:none; border:none; color:var(--ink-faint); padding:8px; border-radius:8px; }
.link-btn{ background:none; border:none; color:var(--ink-soft); font-size:13.5px; margin:14px auto 0; }
.link-btn:hover{ color:var(--primary); }

/* ========================= APP SHELL ========================= */
.shell{ display:grid; grid-template-columns:236px 1fr; min-height:100vh; }
.side{ background:var(--surface); border-right:1px solid var(--line); padding:20px 14px; }
.side-brand{ display:flex; align-items:center; gap:10px; font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:17px; padding:4px 8px 18px; }
.side-mark{ width:30px; height:30px; border-radius:9px; background:linear-gradient(150deg,var(--hero-a),var(--hero-b)); color:var(--hero-ink); display:grid; place-items:center; }
.side-sec{ margin-bottom:16px; }
.side-sec .eyebrow{ padding:6px 8px; }
.nav-item{ width:100%; display:flex; align-items:center; gap:11px; background:none; border:none; color:var(--ink-soft); font-size:14px; font-weight:600; padding:9px 10px; border-radius:10px; text-align:left; cursor:pointer; position:relative; }
.nav-item:hover{ background:var(--line-soft); color:var(--ink); }
.nav-item.is-active{ background:var(--primary-soft); color:var(--primary); }
.nav-item[draggable="true"]{ cursor:grab; }
.nav-item[draggable="true"]:active{ cursor:grabbing; }
.nav-grip{ display:grid; grid-template-columns:repeat(2,2px); gap:2px; margin-left:-3px; opacity:0; transition:opacity .14s; flex:none; }
.nav-grip i{ width:2px; height:2px; border-radius:50%; background:currentColor; display:block; }
.nav-item:hover .nav-grip{ opacity:.5; }
.nav-item.is-drop{ box-shadow:inset 0 2px 0 var(--primary); background:var(--line-soft); }
.side.is-collapsed .nav-grip{ display:none; }
.main{ min-width:0; display:flex; flex-direction:column; }
.topbar{ display:flex; align-items:center; justify-content:space-between; padding:16px 28px; border-bottom:1px solid var(--line); background:var(--bg); position:sticky; top:0; z-index:5; }
.topbar-title{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:19px; display:flex; align-items:center; gap:10px; }
.topbar-sub{ font-family:'Space Mono',monospace; font-size:11.5px; color:var(--ink-faint); letter-spacing:.04em; margin-top:2px; }
.topbar-right{ display:flex; align-items:center; gap:10px; }
.search{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px solid var(--line); border-radius:11px; padding:9px 14px; color:var(--ink-faint); font-size:13.5px; width:230px; }
.icon-btn{ position:relative; width:40px; height:40px; border-radius:11px; border:1px solid var(--line); background:var(--surface); color:var(--ink-soft); display:grid; place-items:center; }
.icon-btn:hover{ color:var(--ink); }
.icon-btn .dot{ position:absolute; top:-5px; right:-5px; background:color-mix(in oklab, var(--bad) 70%, #000); color:#fff; font-size:10px; font-weight:700; border-radius:9px; min-width:17px; height:17px; display:grid; place-items:center; padding:0 3px; }

.page{ padding:26px 28px 120px; max-width:1180px; width:100%; margin:0 auto; display:flex; flex-direction:column; gap:var(--gap); }

/* alert */
.alert{ display:flex; align-items:center; gap:14px; background:var(--amber-soft); border:1px solid color-mix(in oklab,var(--amber) 30%,transparent); border-radius:16px; padding:14px 16px; }
.alert-ic{ width:38px; height:38px; border-radius:11px; background:color-mix(in oklab,var(--amber) 22%,transparent); color:var(--amber); display:grid; place-items:center; flex:none; }
.alert-body{ flex:1; }
.alert-title{ font-weight:700; font-size:14.5px; }
.alert-sub{ font-size:12.5px; color:var(--ink-soft); margin-top:1px; }

/* hero */
.hero{ background:linear-gradient(135deg,var(--hero-a),var(--hero-b)); border-radius:22px; padding:26px 30px; display:grid; grid-template-columns:1fr auto; gap:30px; color:var(--hero-ink); box-shadow:var(--shadow); }
.hero-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:clamp(38px,4.2vw,52px); line-height:1; letter-spacing:-.02em; margin:8px 0 6px; white-space:nowrap; }
.hero-meta{ font-size:13.5px; color:var(--hero-faint); }
.hero-bar{ position:relative; height:8px; border-radius:6px; background:rgba(255,255,255,.16); margin:20px 0 8px; }
.hero-bar-fill{ position:absolute; left:0; top:0; bottom:0; border-radius:6px; background:var(--hero-ink); transition:width .8s cubic-bezier(.22,1,.36,1); }
.hero-mark{ position:absolute; top:-3px; width:2px; height:14px; background:var(--hero-faint); border-radius:2px; }
.hero-mark--mdrt{ background:var(--gold); }
.hero-scale{ display:flex; justify-content:space-between; font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.06em; color:var(--hero-faint); text-transform:uppercase; }
.hero-side{ text-align:right; max-width:240px; display:flex; flex-direction:column; align-items:flex-end; gap:12px; border-left:1px solid rgba(255,255,255,.16); padding-left:26px; }
.hero-side-txt{ font-family:'Cabinet Grotesk',sans-serif; font-weight:700; font-size:16px; line-height:1.3; }

/* KPI grid with rhythm */
.kpi-grid{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--gap); }
.kpi{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:var(--pad); box-shadow:var(--shadow); min-width:0; }
.spark{ max-width:100%; display:block; }
.kpi--feature{ grid-column:span 2; display:flex; flex-direction:column; }
.kpi-feature-row{ display:flex; align-items:center; justify-content:space-between; margin-top:10px; }
.kpi-big{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:40px; line-height:1; }
.kpi-unit{ font-size:16px; font-weight:700; color:var(--ink-faint); margin-left:4px; }
.kpi-foot{ font-size:12.5px; color:var(--ink-soft); }
.kpi-actions{ display:flex; gap:8px; margin-top:14px; flex-wrap:wrap; }
.chiplet{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; background:var(--surface); border:1px solid var(--line); border-radius:9px; padding:6px 10px; color:var(--ink-soft); }
.streak-flames{ display:flex; gap:3px; }
.kpi-stat-row{ display:flex; align-items:center; gap:13px; margin-top:12px; }
.kpi-stat-meta{ display:flex; flex-direction:column; gap:5px; }

/* two col */
.two-col{ display:grid; grid-template-columns:1fr 1fr; gap:var(--gap); }
.card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:var(--pad); box-shadow:var(--shadow); }
.card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
.badge{ font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; background:var(--primary-soft); color:var(--primary); padding:4px 9px; border-radius:8px; letter-spacing:.05em; }
.points-row{ display:flex; align-items:flex-end; gap:20px; }
.points-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:44px; line-height:.9; }
.points-next{ flex:1; padding-bottom:4px; }
.mini-bar{ height:6px; background:var(--line); border-radius:4px; margin-top:6px; overflow:hidden; }
.mini-bar>div{ height:100%; background:var(--primary); border-radius:4px; }
.badge-row{ display:flex; gap:8px; margin-top:16px; flex-wrap:wrap; }
.award-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:600; color:var(--gold); background:var(--gold-soft); border-radius:9px; padding:6px 10px; }
.feed{ list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:14px; }
.feed li{ display:flex; gap:12px; align-items:flex-start; font-size:13.5px; }
.feed b{ font-weight:700; }
.feed-dot{ width:9px; height:9px; border-radius:50%; background:var(--ink-faint); margin-top:5px; flex:none; }
.feed-dot.ok{ background:var(--good); } .feed-dot.gold{ background:var(--gold); }

/* ========================= CAPTURE ========================= */
.cap-head{ display:flex; justify-content:space-between; align-items:center; }
.pill{ font-family:'Space Mono',monospace; font-size:10.5px; background:var(--primary-soft); color:var(--primary); padding:3px 8px; border-radius:7px; font-weight:700; }
.flame-inline{ display:inline-flex; align-items:center; gap:3px; font-size:13px; color:var(--amber); font-weight:700; }
.daystrip{ display:grid; grid-template-columns:repeat(7,1fr); gap:8px; }
.day{ position:relative; background:var(--card); border:1.5px solid var(--line); border-radius:13px; padding:12px 4px 14px; display:flex; flex-direction:column; align-items:center; gap:3px; transition:.15s; }
.day-d{ font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-faint); font-weight:700; }
.day-n{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:19px; }
.day-dot{ position:absolute; bottom:6px; width:5px; height:5px; border-radius:50%; background:var(--good); }

.day.is-past{ border-color:var(--line); }
.cap-body{ display:grid; grid-template-columns:1fr 320px; gap:var(--gap); align-items:start; }

.sec-title{ font-weight:700; font-size:15px; display:flex; align-items:center; gap:9px; }

.step-btn{ width:38px; height:38px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--ink-soft); display:grid; place-items:center; transition:.12s; }

.rail-num .kpi-unit{ font-size:17px; }
.status-pill{ display:inline-block; font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:4px 10px; border-radius:8px; text-transform:uppercase; letter-spacing:.05em; }
.status-pill.ok{ background:color-mix(in oklab,var(--good) 16%,transparent); color:var(--good); }
.status-pill.warn{ background:var(--amber-soft); color:var(--amber); }
.rail-bar{ height:7px; border-radius:5px; background:var(--line); margin-top:16px; overflow:hidden; }
.rail-bar-fill{ height:100%; background:var(--primary); border-radius:5px; transition:width .4s ease; }
.rail-mini{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:18px; }
.rail-mini-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:24px; margin-top:3px; }
.rail-note{ display:flex; align-items:center; gap:7px; margin-top:18px; padding-top:16px; border-top:1px solid var(--line-soft); font-size:12px; color:var(--ink-faint); }
.cap-foot{ position:fixed; bottom:0; left:236px; right:0; padding:16px; display:flex; justify-content:center; background:linear-gradient(transparent,var(--bg) 40%); z-index:6; }

/* ========================= CELEBRATION ========================= */
.celebrate{ min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px 20px; position:relative; overflow:hidden; text-align:center; }
.celebrate-rays{ position:absolute; width:680px; height:680px; border-radius:50%; background:radial-gradient(circle,color-mix(in oklab,var(--gold) 20%,transparent),transparent 62%); opacity:0; transition:opacity 1s ease, transform 1s ease; transform:scale(.6); }
.is-lit .celebrate-rays{ opacity:1; transform:scale(1); }
.celebrate-badge{ width:92px; height:92px; border-radius:50%; background:var(--gold-soft); color:var(--gold); display:grid; place-items:center; margin:18px 0 22px; position:relative; transform:scale(.7); opacity:0; transition:transform .6s cubic-bezier(.34,1.56,.64,1) .1s, opacity .5s ease .1s; box-shadow:0 0 0 0 color-mix(in oklab,var(--gold) 40%,transparent); }
.is-lit .celebrate-badge{ transform:scale(1); opacity:1; box-shadow:0 0 0 12px color-mix(in oklab,var(--gold) 12%,transparent); }
.celebrate-ship{ font-family:'Space Mono',monospace; font-size:12px; letter-spacing:.16em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
.celebrate-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:72px; line-height:1; letter-spacing:-.03em; margin:8px 0 8px; }
.celebrate-sub{ color:var(--ink-soft); font-size:14px; }
.celebrate-pts{ background:var(--card); border:1px solid var(--line); border-radius:18px; padding:20px 24px; margin-top:28px; width:380px; max-width:90vw; box-shadow:var(--shadow); }
.celebrate-pts-head{ display:flex; align-items:center; justify-content:space-between; }
.celebrate-pts-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:26px; color:var(--primary); }
.celebrate-track{ height:8px; border-radius:6px; background:var(--line); margin:14px 0 10px; overflow:hidden; }
.celebrate-track-fill{ height:100%; border-radius:6px; background:linear-gradient(90deg,var(--primary),var(--gold)); transition:width 1s cubic-bezier(.22,1,.36,1) .3s; }
.celebrate-pts-foot{ display:flex; justify-content:space-between; font-size:12.5px; color:var(--ink-soft); }
.celebrate-note{ color:var(--ink-faint); font-size:12.5px; margin-top:22px; max-width:360px; line-height:1.5; }
@media (prefers-reduced-motion:reduce){ .celebrate-rays,.celebrate-badge,.celebrate-track-fill,.ring-fill,.hero-bar-fill{ transition:none !important; } }

/* ========================= MEETING MODE ========================= */
.mm{ --mm-teal:#5cc7c9; min-height:100vh; background:radial-gradient(140% 120% at 20% 0%,#1e2b2b 0%,#14100d 55%,#100c09 100%); color:#f3efe6; padding:26px 40px 20px; display:flex; flex-direction:column; }
.mm-top{ display:flex; align-items:center; justify-content:space-between; }
.mm-brand{ display:flex; align-items:center; gap:10px; font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:16px; color:#e9e3d8; }
.mm-mark{ width:28px; height:28px; border-radius:8px; background:linear-gradient(150deg,#1e6f73,#0c3f43); display:grid; place-items:center; color:#d8f5f2; }
.mm-toggle{ display:flex; gap:4px; background:rgba(255,255,255,.06); border-radius:12px; padding:4px; }
.mm-toggle button{ display:flex; align-items:center; gap:7px; background:none; border:none; color:#9fb3b2; font-weight:700; font-size:13.5px; padding:8px 16px; border-radius:9px; }
.mm-toggle button.is-on{ background:var(--mm-teal); color:#0c1b1b; }
.mm-x{ display:flex; align-items:center; gap:7px; background:rgba(255,255,255,.06); border:none; color:#c9d5d4; font-weight:600; font-size:13px; padding:9px 15px; border-radius:10px; }
.mm-branch{ display:flex; align-items:center; justify-content:space-between; margin-top:26px; }
.mm-week{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:34px; letter-spacing:-.02em; margin-top:6px; color:#f6f2e9; white-space:nowrap; }
.mm-stats{ display:grid; grid-template-columns:1.6fr 1fr 1fr 1.3fr; gap:16px; margin-top:24px; }
.mm-tile{ background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:18px; padding:20px 22px; }
.mm-tile--hero{ background:linear-gradient(150deg,rgba(92,199,201,.12),rgba(255,255,255,.03)); }
.mm-tile--gold{ background:linear-gradient(150deg,rgba(215,172,89,.12),rgba(255,255,255,.03)); border-color:rgba(215,172,89,.22); }
.mm-tile-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:44px; line-height:1; margin:12px 0 8px; letter-spacing:-.02em; }
.mm-teal{ color:var(--mm-teal); } .mm-gold{ color:#dcb56a; }
.mm-pct{ font-size:24px; color:#9fb3b2; }
.mm-tile-foot{ font-size:12.5px; }
.mm-tile-name{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:26px; margin:12px 0 8px; }
.mm-board{ margin-top:20px; background:rgba(255,255,255,.03); border:1px solid rgba(255,255,255,.07); border-radius:18px; padding:8px 20px; flex:1; }
.mm-board-head{ padding:12px 0 8px; }
.mm-row{ display:grid; grid-template-columns:34px 1.5fr 2fr auto auto auto; align-items:center; gap:16px; padding:11px 0; border-top:1px solid rgba(255,255,255,.06); }
.mm-row:first-of-type{ border-top:none; }
.mm-rank{ width:30px; height:30px; border-radius:50%; background:var(--line); display:grid; place-items:center; font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:14px; color:var(--ink-soft); }
.mm .mm-rank{ background:rgba(255,255,255,.07); color:#c9d5d4; }
.mm-rank.is-gold{ background:linear-gradient(150deg,#d7ac59,#b8862f); color:#241a08; }
.mm-agent-name{ font-weight:700; font-size:15px; }
.mm-agent-unit{ font-family:'Space Mono',monospace; font-size:10.5px; color:#8fa3a2; text-transform:uppercase; letter-spacing:.06em; margin-top:2px; }
.mm-track{ height:8px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
.mm-track-fill{ height:100%; border-radius:5px; background:linear-gradient(90deg,var(--mm-teal),#3a8f91); transition:width .8s ease; }
.mm-agent-api{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:15px; min-width:120px; text-align:right; }

.mm-foot{ display:flex; align-items:center; justify-content:center; gap:20px; padding:16px 0 4px; }
.mm-nav{ width:44px; height:44px; border-radius:50%; background:rgba(255,255,255,.06); border:none; color:#e9e3d8; display:grid; place-items:center; }

.mm-dots{ display:flex; gap:8px; }
.mm-dots span{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.2); }
.mm-dots span.on{ background:var(--mm-teal); width:22px; border-radius:5px; }

/* ========================= MANAGER / ADMIN / WEAK-SURFACE ========================= */
.side-role{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--ink-faint); padding:0 8px 14px; }
.kpi-ic{ width:30px; height:30px; border-radius:9px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; }
.role-list{ display:flex; flex-direction:column; gap:14px; }
.role-top{ display:flex; justify-content:space-between; font-size:13.5px; font-weight:600; margin-bottom:6px; }
.role-top b{ font-family:'Cabinet Grotesk',sans-serif; }
.role-bar{ height:8px; border-radius:5px; background:var(--line); overflow:hidden; }
.role-fill{ height:100%; border-radius:5px; transition:width .6s ease; }
.branch-item{ display:flex; align-items:center; justify-content:space-between; padding:14px; border:1px solid var(--line); border-radius:12px; margin-top:12px; }
.branch-item.is-add{ justify-content:center; gap:8px; color:var(--primary); font-weight:700; font-size:13.5px; border-style:dashed; cursor:pointer; }

.seg{ display:flex; gap:4px; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:4px; width:fit-content; }
.seg button{ display:flex; align-items:center; gap:8px; background:none; border:none; color:var(--ink-soft); font-weight:700; font-size:13.5px; padding:9px 16px; border-radius:9px; }
.seg button.is-on{ background:var(--primary); color:var(--primary-ink); }
.seg-badge{ font-family:'Space Mono',monospace; font-size:10px; background:rgba(255,255,255,.2); padding:2px 7px; border-radius:6px; }
.seg button:not(.is-on) .seg-badge,.seg-badge.muted{ background:var(--line); color:var(--ink-faint); }

.hero--flat{ display:block; }
.filing-bar{ height:34px; border-radius:11px; background:rgba(255,255,255,.14); margin:18px 0; overflow:hidden; position:relative; }
.filing-bar::after{ content:''; position:absolute; inset:0; background:repeating-linear-gradient(45deg,transparent,transparent 10px,rgba(224,128,99,.4) 10px,rgba(224,128,99,.4) 20px); }
.filing-fill{ height:100%; background:var(--hero-ink); }
.filing-stats{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
.file-stat{ display:flex; gap:10px; align-items:center; }
.file-key{ width:12px; height:12px; border-radius:4px; flex:none; }
.file-key.sq{ background:var(--hero-faint); } .file-key.ok{ background:#63b47c; } .file-key.warn{ background:var(--gold); } .file-key.bad{ background:#e08063; }
.file-val{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:19px; color:var(--hero-ink); }

.nudge-head{ display:flex; align-items:center; justify-content:space-between; padding:16px 20px; border-bottom:1px solid var(--line); }
.nudge-row{ display:flex; align-items:center; gap:13px; padding:13px 20px; border-top:1px solid var(--line-soft); }
.nudge-row:first-of-type{ border-top:none; }
.ava{ width:36px; height:36px; border-radius:50%; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:12px; flex:none; }
.nudge-btn{ display:flex; align-items:center; gap:6px; background:var(--surface); border:1.5px solid var(--line); color:var(--primary); font-weight:700; font-size:12.5px; padding:8px 14px; border-radius:10px; }
.nudge-btn:hover{ border-color:var(--primary); }

.sheet-toolbar{ display:flex; gap:10px; align-items:center; }
.sel{ display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--line); border-radius:11px; padding:9px 14px; font-size:13.5px; font-weight:600; white-space:nowrap; }
.sheet-scroll{ overflow-x:auto; }
.sheet-head,.sheet-row{ display:grid; grid-template-columns:1.4fr .7fr repeat(7,1fr); }
.sheet-wide{ min-width:820px; }
.sheet-head{ padding:12px 20px; border-bottom:1px solid var(--line); }
.sheet-col{ font-family:'Space Mono',monospace; font-size:10px; letter-spacing:.06em; text-transform:uppercase; color:var(--ink-faint); font-weight:700; }
.sheet-empty{ position:relative; min-height:300px; }
.sheet-ghost{ padding:8px 20px; opacity:.45; -webkit-mask-image:linear-gradient(#000,transparent 85%); mask-image:linear-gradient(#000,transparent 85%); }
.sheet-row{ padding:14px 20px; align-items:center; }
.sheet-empty-core{ position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:20px; }
.sheet-foot{ padding:12px 20px; border-top:1px solid var(--line); font-family:'Space Mono',monospace; font-size:11px; color:var(--ink-faint); }
/* live (populated) dense sheet: sticky header + sticky first column + vertical scroll-in-card */
.sheet-scroll--live{ overflow:auto; max-height:calc(100vh - 250px); }
.sheet-scroll--live .sheet-head{ position:sticky; top:0; z-index:4; background:var(--surface); }
.sheet-scroll--live .sheet-row{ background:var(--card); border-top:1px solid var(--line-soft); }
.sheet-scroll--live .sheet-row:hover{ background:var(--surface); }
.sheet-col--stick{ position:sticky; left:0; z-index:2; background:inherit; padding-right:10px; }
.sheet-scroll--live .sheet-head .sheet-col--stick{ z-index:6; }
.sheet-num{ font-variant-numeric:tabular-nums; }
.sheet-agent{ display:flex; align-items:center; gap:8px; font-weight:600; font-size:13px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ava--xs{ width:24px; height:24px; font-size:9.5px; flex:none; }
.pill-status{ font-size:10.5px; font-weight:700; padding:3px 9px; border-radius:20px; white-space:nowrap; }
.pill-status.is-in{ background:color-mix(in oklab,var(--good) 16%,transparent); color:var(--good); }
.pill-status.is-out{ background:var(--line-soft); color:var(--ink-faint); }
.pill-status.is-warn{ background:var(--amber-soft); color:var(--amber); }
.pill-status.is-bad{ background:color-mix(in oklab,var(--bad) 16%,transparent); color:var(--bad); }
/* leaderboard — ranked, stress-scrollable */
.lb-scroll{ overflow:auto; max-height:calc(100vh - 250px); }
.lb-row{ display:grid; grid-template-columns:34px 26px 1.3fr 2fr auto; align-items:center; gap:12px; padding:11px 18px; border-top:1px solid var(--line-soft); }
.lb-row:first-child{ border-top:none; }
.lb-row:hover{ background:var(--surface); }
.lb-rank{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:15px; color:var(--ink-faint); text-align:center; }
.lb-rank.is-gold{ color:var(--gold); } .lb-rank.is-silver{ color:#9aa0a6; } .lb-rank.is-bronze{ color:var(--amber); }
.lb-name{ font-weight:600; font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.lb-bar{ height:8px; border-radius:6px; background:var(--line-soft); overflow:hidden; }
.lb-bar>div{ height:100%; background:var(--primary); border-radius:6px; }
.lb-row--top .lb-bar>div{ background:var(--gold); }
.lb-api{ font-variant-numeric:tabular-nums; font-family:'Space Mono',monospace; font-size:12px; color:var(--ink-soft); white-space:nowrap; }

.fin-tabs{ display:flex; gap:4px; overflow-x:auto; border-bottom:1px solid var(--line); }
.fin-tab{ background:none; border:none; border-bottom:2px solid transparent; color:var(--ink-soft); font-weight:700; font-size:13.5px; padding:11px 15px; white-space:nowrap; }
.fin-tab.is-on{ color:var(--primary); border-bottom-color:var(--primary); }
.fin-summary{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }
.fin-item{ display:flex; align-items:center; gap:13px; width:100%; padding:14px 20px; border:none; border-top:1px solid var(--line-soft); background:none; }
.fin-item:first-of-type{ border-top:none; }
.fin-item:hover{ background:var(--surface); }
.fin-take{ text-align:right; }
.fin-take-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:17px; }
.risk{ font-family:'Space Mono',monospace; font-size:10.5px; font-weight:700; padding:4px 9px; border-radius:8px; letter-spacing:.04em; }
.risk--ok{ background:color-mix(in oklab,var(--good) 16%,transparent); color:var(--good); }
.risk--watch{ background:var(--amber-soft); color:var(--amber); }
.risk--high{ background:color-mix(in oklab,var(--bad) 16%,transparent); color:var(--bad); }

.hero .ring-val{ color:var(--hero-ink); }
.hero .ring-sub{ color:var(--hero-faint); }
.mm .ring-val{ color:#f3efe6; }
.mm .ring-sub{ color:#8fa3a2; }
.aw-tabs{ display:flex; gap:4px; align-items:center; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:5px; }
.aw-tabs button{ background:none; border:none; color:var(--ink-soft); font-weight:700; font-size:13px; padding:8px 14px; border-radius:9px; }
.aw-tabs button.is-on{ background:var(--card-raised); color:var(--ink); box-shadow:var(--shadow); }
.aw-card{ background:var(--card); border:1px solid var(--line); border-radius:16px; padding:var(--pad); box-shadow:var(--shadow); }
.aw-card--gold{ border-color:color-mix(in oklab,var(--gold) 35%,var(--line)); background:linear-gradient(150deg,var(--gold-soft),var(--card)); }
.aw-num{ font-family:'Cabinet Grotesk',sans-serif; font-weight:900; font-size:30px; margin:10px 0 4px; }
.aw-bar{ height:7px; border-radius:5px; background:var(--line); overflow:hidden; margin-top:8px; }
.aw-bar>div{ height:100%; border-radius:5px; }
.aw-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }
.aw-pct{ font-family:'Space Mono',monospace; font-size:12px; font-weight:700; color:var(--primary); background:var(--primary-soft); padding:3px 8px; border-radius:7px; }

/* ========================= AGENT/MANAGER MORE SCREENS ========================= */
.scr-title{ font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:24px; letter-spacing:-.02em; margin:0; }
.scr-sub{ color:var(--ink-soft); font-size:13.5px; margin:6px 0 0; }
.week-list{ display:flex; flex-direction:column; gap:10px; }
.week-card{ display:flex; align-items:center; gap:13px; background:var(--card); border:1.5px solid var(--line); border-radius:14px; padding:15px 16px; box-shadow:var(--shadow); }

.wiz-head{ display:flex; align-items:flex-start; justify-content:space-between; }
.save-chip{ display:inline-flex; align-items:center; gap:6px; font-size:12px; font-weight:700; color:var(--good); background:color-mix(in oklab,var(--good) 14%,transparent); padding:6px 12px; border-radius:9px; }

.wiz-field{ margin-top:16px; }
.tag-teal{ display:inline-block; background:var(--primary); color:var(--primary-ink); font-family:'Space Mono',monospace; font-size:11px; font-weight:700; padding:5px 11px; border-radius:9px; margin-bottom:14px; }
.wiz-foot{ display:flex; align-items:center; justify-content:space-between; gap:14px; margin-top:8px; }
.rev-rows{ display:flex; flex-direction:column; }

.badge-card{ text-align:center; padding:10px; }

.perf-group{ display:grid; grid-template-columns:1.6fr .7fr 1.7fr 1.7fr 1fr; min-width:900px; padding:10px 20px 0; }

.check-row{ display:flex; align-items:center; gap:10px; font-size:14px; cursor:pointer; }

.aom-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--gap); }

.rec-top{ display:flex; align-items:center; justify-content:space-between; }

.rec-smart{ display:flex; justify-content:flex-end; }

.m-sheet-grip{ width:44px; height:5px; border-radius:3px; border:none; background:var(--line); margin:4px auto 12px; flex:none; padding:0; cursor:pointer; }
.m-sheet-head{ display:flex; align-items:center; justify-content:center; font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:16px; margin-bottom:14px; flex:none; }
.m-sheet-scroll{ overflow-y:auto; -webkit-overflow-scrolling:touch; flex:1 1 auto; }
.m-sheet-close{ flex:none; margin-top:12px; min-height:52px; border-radius:14px; border:1px solid var(--line); background:var(--surface); color:var(--ink); font-family:'Cabinet Grotesk',sans-serif; font-weight:800; font-size:15px; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; }
.m-sheet-close:active{ background:var(--line); }
.m-sheet-close svg{ color:var(--ink-soft); }
.m-sheet-close.is-done{ background:var(--primary); border-color:var(--primary); color:var(--primary-ink); box-shadow:0 6px 18px -6px color-mix(in oklab, var(--primary) 65%, transparent); }
.m-sheet-close.is-done:active{ background:color-mix(in oklab, var(--primary) 88%, black); }
.m-sheet-close.is-done svg{ color:var(--primary-ink); }
.m-sheet-sec{ margin-bottom:18px; }
.m-sheet-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:9px; }
.m-sheet-cell{ position:relative; display:flex; }
.m-sheet-item{ flex:1 1 auto; display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px; padding-right:34px; font-size:13px; font-weight:700; color:var(--ink-soft); text-align:left; min-height:50px; }
.m-sheet-item span{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.m-sheet-item svg{ color:var(--ink-faint); flex:none; }
.m-sheet-item.is-active{ background:var(--primary-soft); border-color:var(--primary); color:var(--primary); }
.m-sheet-item.is-active svg{ color:var(--primary); }
.m-sheet-pin{ position:absolute; top:50%; right:6px; transform:translateY(-50%); width:26px; height:26px; border-radius:8px; border:none; background:none; color:var(--ink-faint); opacity:.42; display:grid; place-items:center; cursor:pointer; }
.m-sheet-pin:active{ background:var(--line); }
.m-sheet-pin.is-pinned{ opacity:1; color:var(--primary); }
/* Mobile create bottom-sheet */
.m-create-list{ display:flex; flex-direction:column; gap:8px; }
.m-create-item{ display:flex; align-items:center; gap:13px; width:100%; background:var(--surface); border:1px solid var(--line); border-radius:13px; padding:13px 14px; font-size:14.5px; font-weight:700; color:var(--ink); text-align:left; min-height:56px; cursor:pointer; }
.m-create-item:active{ background:var(--line); }
.m-create-ic{ width:36px; height:36px; border-radius:10px; background:var(--primary-soft); color:var(--primary); display:grid; place-items:center; flex:none; }
.m-create-lab{ flex:1 1 auto; }
/* Compact the daily-log alert on mobile */
.app-root[data-view="mobile"] .alert{ padding:11px 13px; gap:11px; border-radius:13px; }
.app-root[data-view="mobile"] .alert-ic{ width:32px; height:32px; }
.app-root[data-view="mobile"] .alert-title{ font-size:13.5px; }
.app-root[data-view="mobile"] .alert-sub{ display:none; }

.app-root[data-view="mobile"] .rec-fields{ grid-template-columns:1fr; }
.app-root[data-view="mobile"] .rec-header{ flex-wrap:wrap; }

.proto-rail{ position:fixed; bottom:16px; left:50%; transform:translateX(-50%); z-index:100; display:flex; align-items:center; gap:6px; background:color-mix(in oklab,var(--card) 88%,transparent); backdrop-filter:blur(14px); border:1px solid var(--line); border-radius:16px; padding:7px; box-shadow:0 12px 40px -12px rgba(0,0,0,.35); }

function MobileTab({ tabs, screen, go, onMore, primary, onCreate, current, onReorder }){
  const inTabs = tabs.some(t=>t[2]===screen);
  const deep = !inTabs;
  const moreItem = { more:true, on:deep, ic: deep && current ? current.ic : 'grid', lab: deep && current ? current.label : 'More' };
  const items = [...tabs.map(([ic,lab,id])=>({ic,lab,id,on:screen===id})), moreItem];
  const drag = React.useRef(null);
  const [over, setOver] = React.useState(null);
  const onTouch = useTouchReorder();
  const btn = (it,i) => it.more
    ? <button key="more" className={'mtab mtab-more'+(it.on?' is-on':'')} onClick={onMore} aria-current={it.on?'page':undefined} aria-haspopup="dialog" aria-label={it.on ? (it.lab+' \u2014 open menu') : 'More \u2014 open menu'}>
        <span className="mtab-more-ic"><Icon name={it.ic} size={20}/><span className="mtab-dots" aria-hidden="true"><i></i><i></i><i></i></span></span>
        <span>{it.lab}</span>
      </button>
    : <button key={it.id} data-rid={it.id} data-rgroup="mtab" className={'mtab'+(it.on?' is-on':'')+(over===it.id?' is-drop':'')}
        aria-current={it.on?'page':undefined}
        draggable={!!onReorder}
        onPointerDown={onReorder ? onTouch(it.id, 'mtab', (from,to)=>onReorder(from,to)) : undefined}
        onDragStart={e=>{ drag.current=it.id; e.dataTransfer.effectAllowed='move'; try{e.dataTransfer.setData('text/plain',it.id);}catch(x){} }}
        onDragOver={e=>{ if(drag.current){ e.preventDefault(); if(drag.current!==it.id) setOver(it.id); } }}
        onDragLeave={()=>setOver(o=>o===it.id?null:o)}
        onDrop={e=>{ e.preventDefault(); if(drag.current && drag.current!==it.id && onReorder) onReorder(drag.current, it.id); drag.current=null; setOver(null); }}
        onDragEnd={()=>{ drag.current=null; setOver(null); }}
        onClick={e=>{ if(drag.current) return; const el=e.currentTarget; if(el.__reorderJustDragged && Date.now()-el.__reorderJustDragged<400) return; go(it.id); }}><Icon name={it.ic} size={20}/><span>{it.lab}</span></button>;
  if(!primary){
    return <nav className="mobile-tab" aria-label="Primary">{items.map(btn)}</nav>;
  }
  const mid = Math.ceil(items.length/2);
  const left = items.slice(0,mid), right = items.slice(mid);
  return (
    <nav className="mobile-tab has-fab" aria-label="Primary">
      {left.map(btn)}
      <button className="mtab-fab" onClick={onCreate} aria-label={primary.label}>
        <Icon name="plus" size={26}/>
      </button>
      {right.map(btn)}
      <span className="mtab-fab-label">{primary.label}</span>
    </nav>
  );
}

function MobileMore({ open, title, sections, active, onNav, onClose, lens, onLens, pinnedItems, frequentItems, pinnedSet, onTogglePin }){

  const cell = ([ic,label]) => (
    <div key={label} className="m-sheet-cell">

      <button className={'m-sheet-pin'+(pinnedSet && pinnedSet.has(label)?' is-pinned':'')}
        onClick={e=>{ e.stopPropagation(); onTogglePin && onTogglePin(label); }}
        aria-label={pinnedSet && pinnedSet.has(label)?'Unpin':'Pin'} title={pinnedSet && pinnedSet.has(label)?'Unpin':'Pin to top'}>
        <Icon name="pin" size={13}/>
      </button>
    </div>
  );
  return (
    <div className={'m-sheet'+(open?' is-open':'')} onClick={onClose} role="dialog" aria-modal="true" aria-label={title||'Navigation menu'} aria-hidden={!open}>
      <div className="m-sheet-panel" ref={trapRef} onClick={e=>e.stopPropagation()}>
        <button className="m-sheet-grip" onClick={onClose} aria-label="Close menu"/>
        <div className="m-sheet-head"><span>{title||'All screens'}</span></div>
        {onLens && (
          <div className="m-lens m-lens--insheet">
            <button className={'m-lens-btn'+(lens==='book'?' is-on':'')} onClick={()=>onLens('book')}><Icon name="home" size={15}/> My Book</button>

          {pinnedItems && pinnedItems.length>0 && (
            <div className="m-sheet-sec">
              <Eyebrow tone="faint"><Icon name="pin" size={11} style={{marginRight:5,verticalAlign:'-1px'}}/>Pinned</Eyebrow>
              <div className="m-sheet-grid">{pinnedItems.map(cell)}</div>
            </div>
          )}
          {frequentItems && frequentItems.length>0 && (
            <div className="m-sheet-sec">
              <Eyebrow tone="faint">Frequent</Eyebrow>
              <div className="m-sheet-grid">{frequentItems.map(cell)}</div>
            </div>
          )}
          {sections.map(sec=>(
            <div key={sec.g} className="m-sheet-sec">
              <Eyebrow tone="faint">{sec.g}</Eyebrow>
              <div className="m-sheet-grid">
                {sec.items.map(cell)}

            </div>
          ))}
        </div>
        <button className="m-sheet-close is-done" onClick={onClose}><Icon name="check" size={18}/> Done</button>

    </div>
  );
}

function App(){
  const [screen, setScreen] = useState(() => localStorage.getItem('at_screen') || 'dashboard');
  const [theme, setTheme] = useState(() => localStorage.getItem('at_theme') || 'light');
  const [accent, setAccent] = useState(() => localStorage.getItem('at_accent') || 'teal');
  const [density, setDensity] = useState(() => localStorage.getItem('at_density') || 'comfortable');
  const [view, setView] = useState(() => localStorage.getItem('at_view') || 'desktop');
  const [navCollapsed, setNavCollapsed] = useState(() => localStorage.getItem('at_nav') === 'collapsed');
  const [persona, setPersona] = useState(() => localStorage.getItem('at_persona') || 'auto');
  const [moreOpen, setMoreOpen] = useState(false);
  const [createOpen, setCreateOpen] = useState(false);
  const [demoState, setDemoState] = useState('ready');
  const [stress, setStress] = useState(() => localStorage.getItem('at_stress') === '1');
  useEffect(() => { window.__atStress = stress; localStorage.setItem('at_stress', stress ? '1' : '0'); try { window.dispatchEvent(new Event('at-stress')); } catch (e) {} }, [stress]);
  const [palette, setPalette] = useState({ open:false, mode:'search' });
  const [pins, setPins] = useState(() => { try { return JSON.parse(localStorage.getItem('at_pins')||'[]'); } catch(e){ return []; } });
  const [freq, setFreq] = useState(() => { try { return JSON.parse(localStorage.getItem('at_freq')||'{}'); } catch(e){ return {}; } });
  const [navOrder, setNavOrder] = useState(() => { try { return JSON.parse(localStorage.getItem('at_navorder')||'{}'); } catch(e){ return {}; } });
  const [tabOrder, setTabOrder] = useState(() => { try { return JSON.parse(localStorage.getItem('at_taborder')||'{}'); } catch(e){ return {}; } });
  useEffect(()=>{ localStorage.setItem('at_screen',screen); },[screen]);
  useEffect(()=>{ setFreq(f=>{ const n={...f,[screen]:(f[screen]||0)+1}; localStorage.setItem('at_freq',JSON.stringify(n)); return n; }); },[screen]);
  useEffect(()=>{ localStorage.setItem('at_theme',theme); },[theme]);
  useEffect(()=>{ localStorage.setItem('at_accent',accent); },[accent]);
  useEffect(()=>{ localStorage.setItem('at_density',density); },[density]);
  useEffect(()=>{ localStorage.setItem('at_view',view); },[view]);
  useEffect(()=>{ localStorage.setItem('at_nav', navCollapsed?'collapsed':'expanded'); },[navCollapsed]);
  useEffect(()=>{ localStorage.setItem('at_persona', persona); },[persona]);
  useEffect(()=>{
    const h = e => { if(e.key==='/' && !/input|textarea|select/i.test((e.target.tagName||'')) ){ e.preventDefault(); setPalette({open:true,mode:'search'}); } };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  },[]);
  const goTo = id => { setScreen(id); setPalette(p=>({...p,open:false})); setMoreOpen(false); setCreateOpen(false); };
  const openCmd = mode => setPalette({ open:true, mode });
  const togglePin = label => setPins(p=>{ const n = p.includes(label) ? p.filter(x=>x!==label) : [...p,label]; localStorage.setItem('at_pins',JSON.stringify(n)); return n; });
  const orderSections = (sections, scope) => sections.map(sec=>{
    const saved = navOrder[scope+'|'+sec.g];
    if(!saved) return sec;
    const byLabel = Object.fromEntries(sec.items.map(it=>[it[1],it]));
    const ordered = saved.filter(l=>byLabel[l]).map(l=>byLabel[l]);
    const rest = sec.items.filter(it=>!saved.includes(it[1]));
    return { ...sec, items:[...ordered, ...rest] };
  });
  const reorderNav = (scope) => (g, labels, from, to) => {
    const arr=[...labels]; const fi=arr.indexOf(from); if(fi<0) return; arr.splice(fi,1);
    const ti=arr.indexOf(to); arr.splice(ti<0?arr.length:ti,0,from);
    setNavOrder(prev=>{ const n={...prev,[scope+'|'+g]:arr}; localStorage.setItem('at_navorder',JSON.stringify(n)); return n; });
  };
  const orderTabs = (base, scope) => { // base: array of ids
    const saved = tabOrder[scope];
    if(!saved) return base;
    const inBase = new Set(base);
    return [...saved.filter(id=>inBase.has(id)), ...base.filter(id=>!saved.includes(id))];
  };
  const reorderTabs = (scope, ids, from, to) => {
    const arr=[...ids]; const fi=arr.indexOf(from); if(fi<0) return; arr.splice(fi,1);
    const ti=arr.indexOf(to); arr.splice(ti<0?arr.length:ti,0,from);
    setTabOrder(prev=>{ const n={...prev,[scope]:arr}; localStorage.setItem('at_taborder',JSON.stringify(n)); return n; });
  };

  const sc = BY_ID[screen] || BY_ID.dashboard;
  const Comp = sc.Comp;
  const SKEL_KIND = { mastersheet:'table', policyledger:'table', reconciliation:'table', settlements:'table', users:'table', teamperf:'table', compliance:'table', financing:'table', branches:'table', teamwars:'table', teamplans:'table', capture:'timeline', history:'timeline', policyrecord:'detail', career:'detail', awards:'detail', mywar:'detail' };
  const EMPTY_FOR = {
    capture: <EmptyState icon="calendar" title="No activity logged yet" body={"Log your first call, appointment or sale \u2014 it rolls straight into this week\u2019s report."} cta="Log your first activity" onCta={()=>setDemoState('ready')}/>,
    settlements: <EmptyState icon="book" title="No settlements pending" body="When policies are issued and ready to pay out, they queue here for review." cta="View policy ledger" onCta={()=>{ setDemoState('ready'); goTo('policyledger'); }}/>,
    leaderboard: <EmptyState icon="trophy" title="No ranked sales this period yet" body="The leaderboard fills in as your branch logs its first sales of the period." cta="Back to dashboard" onCta={()=>{ setDemoState('ready'); goTo('dashboard'); }}/>,
    policyledger: <EmptyState icon="book" title="Your pipeline is empty" body="Policies you start appear here as they move from lead to issued." cta="Start a policy" onCta={()=>{ setDemoState('ready'); goTo('policyrecord'); }}/>,
    mastersheet: <EmptyState icon="calendar" title="No submissions yet this week" body={"Rows populate live as agents file their weekly reports. Deadline is Sunday 23:59 AST \u2014 nudge anyone behind from Compliance."} cta="Nudge the team" onCta={()=>{ setDemoState('ready'); goTo('compliance'); }}/>,
    reconciliation: <EmptyState icon="check" title="No policies to reconcile" body={"Settled policies appear here as agents log them. When Tatil\u2019s monthly circular arrives, key any figures that differ from the ledger."} cta="View policy ledger" onCta={()=>{ setDemoState('ready'); goTo('policyledger'); }}/>,
  };
  const cmdRoles = (persona==='sellmgr' && (sc.shell==='agent'||sc.shell==='manager')) ? ['agent','manager']
    : sc.shell==='admin' ? ['admin'] : sc.shell==='manager' ? ['manager'] : ['agent'];
  const createActions = CREATE_ACTIONS.filter(x=>x[3].some(r=>cmdRoles.includes(r)));
  const navTo = (sections) => (label) => { const hit = SCREENS.find(x=>x.active===label && x.shell===sc.shell); if(hit) goTo(hit.id); };

  let content;
  if(sc.shell==='bare') content = <Comp goTo={goTo}/>;
  else if(sc.shell==='meeting') content = <MeetingMode exit={()=>setScreen('teamdash')}/>;
  else {
    const col = navCollapsed, tog = ()=>setNavCollapsed(c=>!c);
    const sellMgr = persona==='sellmgr' && (sc.shell==='agent' || sc.shell==='manager');
    const lens = sc.shell==='manager' ? 'team' : 'book';
    const isMobile = view!=='desktop';
    const onLens = l => goTo(l==='team'?'teamdash':'dashboard');
    let sidebar;
    const navScope = sellMgr ? (lens==='team'?'sm-team':'sm-book') : sc.shell;
    if(sellMgr){
      const smNav = label => { const want = lens==='team'?'manager':'agent'; const hit = SCREENS.find(x=>x.active===label && x.shell===want) || SCREENS.find(x=>x.active===label && (x.shell==='agent'||x.shell==='manager')); if(hit) goTo(hit.id); };
      sidebar = <SellingManagerSidebar agentSections={orderSections(AGENT_SECTIONS,'sm-book')} mgrSections={orderSections(MANAGER_SECTIONS,'sm-team')} active={sc.active} lens={lens} onLens={onLens} onNav={smNav} collapsed={col} onToggle={tog} onReorder={reorderNav(navScope)}/>;
    }
    else if(sc.shell==='agent') sidebar = <Sidebar sections={orderSections(AGENT_SECTIONS,'agent')} active={sc.active} onNav={navTo()} collapsed={col} onToggle={tog} onReorder={reorderNav('agent')}/>;
    else if(sc.shell==='manager') sidebar = <RoleSidebar sections={orderSections(MANAGER_SECTIONS,'manager')} role="Branch Manager" active={sc.active} onNav={navTo()} collapsed={col} onToggle={tog} onReorder={reorderNav('manager')}/>;
    else sidebar = <RoleSidebar sections={orderSections(ADMIN_SECTIONS,'admin')} role="Tenant Admin" active={sc.active} onNav={navTo()} collapsed={col} onToggle={tog} onReorder={reorderNav('admin')}/>;
    let mtabs = AGENT_MTABS;
    if(sc.shell==='manager') mtabs = MGR_MTABS;
    else if(sc.shell==='admin') mtabs = ADMIN_MTABS;
    if(sellMgr) mtabs = lens==='team' ? MGR_MTABS : AGENT_MTABS;
    const primaryFab = { label:'Create' };
    const tabScope = 'mt-'+navScope;
    const barBaseIds = mtabs.filter(t=>t[2]!=='capture').map(t=>t[2]);
    const barTabs = orderTabs(barBaseIds, tabScope).slice(0,3).map(id=>mtabs.find(t=>t[2]===id)).filter(Boolean);
    const moreSections = sellMgr ? (lens==='team'?MANAGER_SECTIONS:AGENT_SECTIONS)
      : (sc.shell==='manager'?MANAGER_SECTIONS : sc.shell==='admin'?ADMIN_SECTIONS : AGENT_SECTIONS);
    const resolveId = label => { if(sellMgr){ const want=lens==='team'?'manager':'agent'; const hit=SCREENS.find(x=>x.active===label&&x.shell===want)||SCREENS.find(x=>x.active===label&&(x.shell==='agent'||x.shell==='manager')); return hit&&hit.id; } const hit=SCREENS.find(x=>x.active===label&&x.shell===sc.shell); return hit&&hit.id; };
    const moreNav = label => { const id=resolveId(label); if(id) goTo(id); };
    const flatItems = moreSections.flatMap(s=>s.items);
    const pinnedItems = flatItems.filter(([ic,label])=>pins.includes(label));
    const frequentItems = flatItems
      .map(pair=>({ pair, id:resolveId(pair[1]) }))
      .filter(x=> x.id && (freq[x.id]||0)>0 && !pins.includes(x.pair[1]) && x.id!==screen)
      .sort((a,b)=>(freq[b.id]||0)-(freq[a.id]||0))
      .slice(0,4).map(x=>x.pair);
    content = (
      <div className="shell">
        {sidebar}
        <main className="main" id="main-content">
          <Topbar title={sc.title} sub={sc.sub} theme={theme} setTheme={setTheme} onCmd={openCmd}/>
          {isMobile && sellMgr && <MobileLens lens={lens} onLens={onLens}/>}
          <div className="screen-enter" key={screen + '|' + demoState}>
            <StateLayer state={demoState} kind={SKEL_KIND[screen] || 'cards'} onRetry={()=>setDemoState('ready')} empty={EMPTY_FOR[screen]}>
              <Comp goTo={goTo}/>
            </StateLayer>
          </div>
        </main>
        {isMobile && <MobileTab tabs={barTabs} screen={screen} go={goTo} onMore={()=>setMoreOpen(true)} primary={primaryFab} onCreate={()=>setCreateOpen(true)} current={{ic:sc.ic, label:sc.active}} onReorder={(from,to)=>reorderTabs(tabScope, barTabs.map(t=>t[2]), from, to)}/>}
        {isMobile && <MobileMore open={moreOpen} title={sellMgr?(lens==='team'?'My Team':'My Book'):'All screens'} sections={moreSections} active={sc.active} onNav={moreNav} onClose={()=>setMoreOpen(false)} lens={sellMgr?lens:undefined} onLens={sellMgr?(l=>setScreen(l==='team'?'teamdash':'dashboard')):undefined} pinnedItems={pinnedItems} frequentItems={frequentItems} pinnedSet={new Set(pins)} onTogglePin={togglePin}/>}
        {isMobile && <MobileCreateSheet open={createOpen} actions={createActions} onGo={goTo} onClose={()=>setCreateOpen(false)}/>}
      </div>
    );
  }

  return (
    <div className="app-root" data-theme={sc.shell==='meeting'?'dark':theme} data-accent={accent} data-density={density} data-view={view==='desktop'?'desktop':'mobile'} data-device={view==='mobile-sm'?'ip8':'std'}>
      <a className="skip-link" href="#main-content">Skip to content</a>
      {content}
      <CommandPalette open={palette.open} mode={palette.mode} screens={SCREENS} roles={cmdRoles} onGo={goTo} onClose={()=>setPalette(p=>({...p,open:false}))}/>
      <div className="proto-rail">
        <select className="proto-select" value={screen} onChange={e=>setScreen(e.target.value)} aria-label="Jump to screen">
          {['Entry','Agent','Manager','Admin'].map(g=>(
            <optgroup key={g} label={g}>
              {SCREENS.filter(s=>s.grp===g).map(s=><option key={s.id} value={s.id}>{s.label.trim()}</option>)}
            </optgroup>
          ))}
        </select>
        <div className="proto-sep"/>
        <span className="proto-label">Theme</span>
        <button className={'proto-btn'+(theme==='light'?' is-on':'')} onClick={()=>setTheme('light')} aria-label="Light theme"><Icon name="sun" size={14}/></button>
        <button className={'proto-btn'+(theme==='dark'?' is-on':'')} onClick={()=>setTheme('dark')} aria-label="Dark theme"><Icon name="moon" size={14}/></button>
        <div className="proto-sep"/>
        <span className="proto-label">View</span>
        <button className={'proto-btn'+(view==='desktop'?' is-on':'')} onClick={()=>setView('desktop')}>Desktop</button>
        <button className={'proto-btn'+(view==='mobile'?' is-on':'')} onClick={()=>setView('mobile')}>Phone</button>
        <button className={'proto-btn'+(view==='mobile-sm'?' is-on':'')} onClick={()=>setView('mobile-sm')}>iPhone 8</button>
        <div className="proto-sep"/>
        <span className="proto-label">Accent</span>
        {[['teal','#01696f'],['ocean','#1a5f8f'],['pine','#2a6a4a']].map(([k,c])=>(
          <button key={k} className={'proto-swatch'+(accent===k?' on':'')} style={{background:c}} onClick={()=>setAccent(k)} aria-label={k}/>
        ))}
        <div className="proto-sep"/>
        <span className="proto-label">Density</span>
        <button className={'proto-btn'+(density==='comfortable'?' is-on':'')} onClick={()=>setDensity('comfortable')}>Comfy</button>
        <button className={'proto-btn'+(density==='compact'?' is-on':'')} onClick={()=>setDensity('compact')}>Compact</button>
        <div className="proto-sep"/>
        <span className="proto-label">Nav</span>
        <button className={'proto-btn'+(!navCollapsed?' is-on':'')} onClick={()=>setNavCollapsed(false)}>Expanded</button>
        <button className={'proto-btn'+(navCollapsed?' is-on':'')} onClick={()=>setNavCollapsed(true)}>Collapsed</button>
        <div className="proto-sep"/>
        <span className="proto-label">Persona</span>
        <button className={'proto-btn'+(persona==='auto'?' is-on':'')} onClick={()=>setPersona('auto')}>Standard</button>
        <button className={'proto-btn'+(persona==='sellmgr'?' is-on':'')} onClick={()=>{ setPersona('sellmgr'); if(!(sc.shell==='agent'||sc.shell==='manager')) goTo('dashboard'); }}>Selling Mgr</button>
        <div className="proto-sep"/>
        <span className="proto-label">State</span>
        <button className={'proto-btn'+(demoState==='ready'?' is-on':'')} onClick={()=>setDemoState('ready')}>Ready</button>
        <button className={'proto-btn'+(demoState==='loading'?' is-on':'')} onClick={()=>setDemoState('loading')}>Loading</button>
        <button className={'proto-btn'+(demoState==='empty'?' is-on':'')} onClick={()=>setDemoState('empty')}>Empty</button>
        <button className={'proto-btn'+(demoState==='error'?' is-on':'')} onClick={()=>setDemoState('error')}>Error</button>
        <div className="proto-sep"/>
        <span className="proto-label">Data</span>
        <button className={'proto-btn'+(!stress?' is-on':'')} onClick={()=>setStress(false)}>Normal</button>
        <button className={'proto-btn'+(stress?' is-on':'')} onClick={()=>setStress(true)}>Stress</button>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
