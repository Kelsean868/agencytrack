<style>
  html, body { margin: 0; padding: 0; }
  body { background: #F0EEE9; font-family: 'Satoshi', sans-serif; }
  a { color: var(--teal, #01696F); }
  a:hover { color: #014E52; }
  .ccp-chip { display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px; font: 700 9.5px var(--mono); letter-spacing: .08em; flex-shrink: 0; white-space: nowrap; }
  .ccp-input:focus { border-color: var(--teal) !important; box-shadow: 0 0 0 3px var(--tealTint); }
  .ccp-ghost { transition: border-color .15s ease, background .15s ease; }
  .ccp-ghost:hover { border-color: var(--teal); }
  .ccp-ghost.is-danger:hover { background: var(--dangerTint); }
  .ccp-railitem:hover { background: var(--surfaceMute); }
  .ccp-railitem[style*="tealTint"]:hover { background: var(--tealTint); }
  .ccp-link:hover { text-decoration: underline; }
  .ccp-xbtn:hover { color: var(--danger) !important; }
  .ccp-segbtn { transition: background .15s ease, color .15s ease; }
  @keyframes ccpflash { 0% { background: var(--tealTint); } 70% { background: var(--tealTint); } 100% { background: transparent; } }
  .ccp-flash { animation: ccpflash 2s ease; }
  .ccp-tablewrap { scrollbar-width: thin; padding-bottom: 2px; }
  @media (prefers-reduced-motion: reduce) {
    .ccp-flash { animation: none; background: var(--tealTint); }
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: rgba(120,112,100,.25); border-radius: 999px; border: 2px solid transparent; background-clip: content-box; }
