<body>
<div id="root"></div>

<script type="text/babel">
const T = {

  ink:'#28251D', inkMute:'#6B6560', inkFaint:'#A8A39C', inkDim:'#CFCBC2',
  rule:'#E5E2DB', ruleStrong:'#CFCBC2',
  teal:'#01696F', tealLight:'#018A91', tealDark:'#014E52', tealTint:'#E6F4F4',
  gold:'#B07D1A', goldTint:'#FAEFD3',
  success:'#2D7A4F', successTint:'#E8F5EE',
  warning:'#B45309', warningTint:'#FEF3E2',

const DISPLAY="'Cabinet Grotesk','Helvetica Neue',Helvetica,Arial,sans-serif";
const SANS="'Satoshi','Helvetica Neue',Helvetica,Arial,sans-serif";
const MONO="'JetBrains Mono','Menlo','SF Mono',monospace";

// ── Icons ─────────────────────────────────────────────────────────────────
function Icon({children,size=18,color='currentColor',stroke=1.8,fill='none'}){
  return <svg width={size} height={size} viewBox="0 0 24 24" fill={fill} stroke={color} strokeWidth={stroke} strokeLinecap="round" strokeLinejoin="round">{children}</svg>;
}
const IHome   =(p)=><Icon {...p}><path d="M3 12L12 4l9 8M5 10v10h14V10"/></Icon>;
const IWizard =(p)=><Icon {...p}><path d="M9 21h6M12 17V11M5 8h14M5 8l2-4h10l2 4M5 8v3a7 7 0 0 0 14 0V8"/></Icon>;
const IHistory=(p)=><Icon {...p}><path d="M3 12a9 9 0 1 0 3-6.7M3 4v5h5M12 7v5l3 2"/></Icon>;
const IChart  =(p)=><Icon {...p}><path d="M3 20h18M5 16V8M11 16V5M17 16v-6"/></Icon>;
const ITarget =(p)=><Icon {...p}><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></Icon>;
const IWallet =(p)=><Icon {...p}><path d="M3 7v10a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7H5a2 2 0 0 1 0-4h14V7"/><circle cx="17" cy="13" r="1"/></Icon>;
const IMedal  =(p)=><Icon {...p}><circle cx="12" cy="15" r="6"/><path d="M8 3l2 6M16 3l-2 6"/></Icon>;
const IShield =(p)=><Icon {...p}><path d="M12 2l8 4v6c0 5-3.5 9-8 10-4.5-1-8-5-8-10V6l8-4z"/></Icon>;
const IBolt   =(p)=><Icon {...p}><polygon points="13 2 4 14 11 14 10 22 19 10 12 10 13 2"/></Icon>;
const IRepeat =(p)=><Icon {...p}><path d="M17 2l4 4-4 4M3 12V8a2 2 0 0 1 2-2h16M7 22l-4-4 4-4M21 12v4a2 2 0 0 1-2 2H3"/></Icon>;
const IBook   =(p)=><Icon {...p}><path d="M4 4h12a4 4 0 0 1 4 4v12H8a4 4 0 0 1-4-4V4z"/><path d="M4 16a4 4 0 0 1 4-4h12"/></Icon>;
const IUsers  =(p)=><Icon {...p}><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13A4 4 0 0 1 16 11"/></Icon>;
const IGrid   =(p)=><Icon {...p}><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></Icon>;
const ISearch =(p)=><Icon {...p}><circle cx="11" cy="11" r="7"/><line x1="20" y1="20" x2="16" y2="16"/></Icon>;
const IBell   =(p)=><Icon {...p}><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10 21h4"/></Icon>;
const IChevR  =(p)=><Icon {...p}><polyline points="9 6 15 12 9 18"/></Icon>;
const IPlus   =(p)=><Icon {...p}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>;
const ITrophy =(p)=><Icon {...p}><path d="M6 4h12v4a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V4z"/><path d="M6 6H4a2 2 0 0 0 2 4M18 6h2a2 2 0 0 1-2 4"/><path d="M9 20h6M12 16v4"/></Icon>;
const IClipboard=(p)=><Icon {...p}><rect x="8" y="3" width="8" height="4" rx="1"/><path d="M8 5H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/></Icon>;
const ICheckSq=(p)=><Icon {...p}><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></Icon>;
const IStar   =(p)=><Icon {...p}><polygon points="12 3 14.6 8.6 21 9.3 16.5 13.7 17.8 20 12 16.8 6.2 20 7.5 13.7 3 9.3 9.4 8.6 12 3"/></Icon>;
const IPencil =(p)=><Icon {...p}><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/></Icon>;
const ICalendar=(p)=><Icon {...p}><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9h18M8 2.5v4M16 2.5v4"/></Icon>;
const IUserPlus=(p)=><Icon {...p}><path d="M15 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/></Icon>;
const IMega   =(p)=><Icon {...p}><path d="M3 11l13-5v12L3 13z"/><path d="M16 8a3 3 0 0 1 0 6"/><path d="M7 13v4a2 2 0 0 0 3.5 1.3"/></Icon>;
const IPresent=(p)=><Icon {...p}><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></Icon>;
const ITv     =(p)=><Icon {...p}><rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/></Icon>;
const IScale  =(p)=><Icon {...p}><path d="M12 3v18M6 7h12M6 7l-3 6h6zM18 7l-3 6h6z"/></Icon>;

// ── small ui ─────────────────────────────────────────────────────────────
function Mono({children,style}){return <span style={{fontFamily:MONO,...style}}>{children}</span>;}

function Seg({options,value,onChange,accent=T.teal}){
  return (
    <div style={{display:'inline-flex',gap:3,padding:3,background:T.surfaceSoft,border:`1px solid ${T.rule}`,borderRadius:10}}>
      {options.map(o=>{
        const on=o.key===value;
        return (
          <button key={o.key} onClick={()=>onChange(o.key)} style={{
            border:'none',cursor:'pointer',padding:'7px 14px',borderRadius:7,fontFamily:SANS,
            fontSize:12.5,fontWeight:700,letterSpacing:'0.005em',whiteSpace:'nowrap',
            background:on?accent:'transparent',color:on?'#fff':T.inkMute,
            boxShadow:on?`0 1px 3px ${accent}55`:'none',transition:'all 160ms ease',
          }}>{o.label}</button>
        );
      })}
    </div>
  );
}

// ── Sidebar ────────────────────────────────────────────────────────────────
function NavRow({item}){
  const {label,Icon:I,active,child,badge,soon,pinnable}=item;
  return (
    <div style={{
      display:'flex',alignItems:'center',gap:child?9:11,position:'relative',
      padding:child?'7px 12px 7px 32px':'8.5px 12px',borderRadius:9,
      background:active?T.tealTint:'transparent',
      color:active?T.teal:(soon?T.inkFaint:T.inkMute),
      fontSize:child?12:13,fontWeight:600,
    }}>
      {active && <div style={{position:'absolute',left:0,top:6,bottom:6,width:3,background:T.teal,borderRadius:999}}/>}
      {child && <div style={{position:'absolute',left:19,top:-2,width:10,height:16,borderLeft:`1.5px solid ${T.rule}`,borderBottom:`1.5px solid ${T.rule}`,borderBottomLeftRadius:5}}/>}
      <I size={child?15:17} color={active?T.teal:(soon?T.inkFaint:T.inkMute)} stroke={1.8}/>
      <div style={{flex:1,whiteSpace:'nowrap'}}>{label}</div>
      {item.scope && <Mono style={{fontSize:7.5,fontWeight:700,letterSpacing:'0.08em',color:item.scope==='team'?T.violet:(item.scope==='shared'?T.inkFaint:T.teal),background:item.scope==='team'?T.violetTint:(item.scope==='shared'?T.surfaceSoft:T.tealTint),padding:'1px 5px',borderRadius:999}}>{item.scope==='team'?'TEAM':(item.scope==='shared'?'BOTH':'MINE')}</Mono>}
      {badge && <span style={{padding:'1px 6px',borderRadius:999,fontSize:8.5,fontWeight:700,background:badge==='NEW'?T.gold:T.inkDim,color:'#fff',letterSpacing:'0.06em'}}>{badge}</span>}
      {soon && <Mono style={{fontSize:8.5,fontWeight:700,color:T.inkFaint,letterSpacing:'0.1em'}}>SOON</Mono>}
      {pinnable && !badge && !soon && <IStar size={13} color={T.inkDim} fill="none"/>}
    </div>
  );
}

function SectionLabel({children,accent}){
  return <div style={{fontSize:9.5,fontWeight:700,color:accent||T.inkFaint,letterSpacing:'0.14em',textTransform:'uppercase',padding:'12px 12px 6px',fontFamily:MONO,display:'flex',alignItems:'center',gap:6}}>{children}</div>;
}

function Sidebar({sections,topToggle,roleLabel,roleSub,initials}){
  return (
    <div style={{
      width:248,height:724,background:T.surface,border:`1px solid ${T.rule}`,borderRadius:16,
      display:'flex',flexDirection:'column',padding:'16px 12px',boxShadow:'0 18px 50px rgba(40,37,29,0.10)',
    }}>
      {/* brand */}
      <div style={{display:'flex',alignItems:'center',gap:10,padding:'2px 8px 14px',borderBottom:`1px solid ${T.rule}`,marginBottom:6}}>
        <Logo size={30}/>
        <div>
          <div style={{fontSize:13.5,fontWeight:700,letterSpacing:'-0.012em'}}>AgencyTrack</div>
          <div style={{fontSize:10,color:T.inkMute,marginTop:1}}>Tatil Life · South</div>
        </div>
      </div>
      {topToggle}
      <div style={{flex:1,overflowY:'auto',overflowX:'hidden'}}>
        {sections.map((s,i)=>(
          <div key={i} style={{marginBottom:6}}>
            {s.title && <SectionLabel accent={s.accent}>{s.icon}{s.title}{s.count!=null && <span style={{marginLeft:'auto',color:T.inkFaint,fontWeight:700}}>{s.count}</span>}</SectionLabel>}
            {s.items.map((it,j)=><NavRow key={j} item={it}/>)}
          </div>
        ))}
      </div>
      {/* user */}
      <div style={{padding:'10px 8px 2px',borderTop:`1px solid ${T.rule}`,display:'flex',alignItems:'center',gap:10,marginTop:6}}>
        <div style={{width:32,height:32,borderRadius:'50%',background:T.tealTint,color:T.teal,display:'flex',alignItems:'center',justifyContent:'center',fontWeight:700,fontSize:12,fontFamily:DISPLAY}}>{initials}</div>
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:12.5,fontWeight:700,whiteSpace:'nowrap',overflow:'hidden',textOverflow:'ellipsis'}}>{roleLabel}</div>
          <div style={{fontSize:10.5,color:T.inkMute,marginTop:1}}>{roleSub}</div>
        </div>
      </div>
    </div>
  );
}

function Logo({size=30}){
  const rad=Math.round(size*0.22);
  return (
    <svg width={size} height={size} viewBox="0 0 200 200" style={{display:'block',borderRadius:rad,flexShrink:0}}>
      <rect width="200" height="200" rx="44" fill="#014e52"/>
      <path d="M100 28 Q65 28 37 42 Q30 45 30 56 L30 115 Q30 160 100 188 Q170 160 170 115 L170 56 Q170 45 163 42 Q135 28 100 28 Z" fill="white" fillOpacity="0.12" stroke="white" strokeOpacity="0.55" strokeWidth="2.5"/>
      <rect x="72" y="127" width="11" height="18" rx="2.5" fill="white" fillOpacity="0.30"/>
      <rect x="87" y="117" width="11" height="28" rx="2.5" fill="white" fillOpacity="0.50"/>
      <rect x="102" y="105" width="11" height="40" rx="2.5" fill="white" fillOpacity="0.75"/>
      <rect x="117" y="93" width="11" height="52" rx="2.5" fill="white"/>
      <circle cx="122.5" cy="86" r="4.5" fill="#4ecdc4"/>
    </svg>
  );
}

        <div>
          <SpecCap n="A" t="Navigation · desktop sidebar" s={showToggle?'Toggle My Work / My Team at top':'Reorganized for this role'}/>
          <Sidebar sections={nav.sections} topToggle={topToggle} roleLabel={meta.label} roleSub={meta.sub} initials={meta.initials}/>
        </div>

        {/* desktop quick add */}
        <div>
          <SpecCap n="B" t="Quick add · desktop" s="Floating pencil opens this popover"/>
          <div style={{position:'relative',width:360,height:724,background:T.surfaceSoft,border:`1px dashed ${T.ruleStrong}`,borderRadius:16,overflow:'hidden'}}>
            <Mono style={{position:'absolute',top:14,left:16,fontSize:10,color:T.inkFaint,letterSpacing:'0.1em'}}>APP CANVAS</Mono>
            <div style={{position:'absolute',right:18,bottom:96,zIndex:2}}>
              {effOption===1?<QuickList data={qa}/>:<QuickGrid data={qa}/>}
            </div>
            {/* the pencil FAB */}
            <div style={{position:'absolute',right:24,bottom:24,width:54,height:54,borderRadius:'50%',background:`linear-gradient(180deg,${T.tealLight},${T.teal})`,display:'flex',alignItems:'center',justifyContent:'center',boxShadow:`0 8px 20px ${T.teal}66`,zIndex:3}}>
              <IPencil size={22} color="#fff" stroke={2.1}/>
              <div style={{position:'absolute',top:6,right:6,width:9,height:9,borderRadius:'50%',background:T.gold,border:`2px solid ${T.surface}`}}/>
            </div>
          </div>
        </div>

        {/* mobile */}
        <div>
          <SpecCap n="C" t="Mobile · pencil removed" s="Center ＋ opens the same actions"/>
          <MobileFrame role={role} option={option} sheet={sheetOpen?qa:null}/>
          <button onClick={()=>setSheetOpen(s=>!s)} style={{marginTop:12,width:330,padding:'9px',border:`1px solid ${T.rule}`,background:T.surface,borderRadius:10,fontFamily:SANS,fontSize:12.5,fontWeight:700,color:T.teal,cursor:'pointer'}}>
            {sheetOpen?'Close ＋ menu':'Tap ＋ to open menu'}
          </button>
        </div>
      </div>

      <div style={{marginTop:46,paddingTop:20,borderTop:`1px solid ${T.rule}`,fontSize:12.5,color:T.inkFaint,lineHeight:1.6,maxWidth:820}}>
        <b style={{color:T.inkMute}}>Decision locked:</b> <b style={{color:T.ink}}>Pinned + groups is the default for every role</b> — agents, producing managers and managers all land here. Workspace and Both stay available as opt-in choices in <i>Profile → Preferences</i> for managers who want them. Dual-context tools appear in both groups (tagged MINE / TEAM) so nothing is lost, and the quick-add menu is identical across layouts. Next: I can take Pinned + groups to hi-fi on the real desktop shell + mobile nav for each role.
      </div>
    </div>
  );
}

function SpecCap({n,t,s}){
  return (
    <div style={{marginBottom:12,display:'flex',alignItems:'center',gap:10}}>
      <div style={{width:24,height:24,borderRadius:7,background:T.ink,color:'#fff',display:'flex',alignItems:'center',justifyContent:'center',fontFamily:DISPLAY,fontWeight:700,fontSize:12,flexShrink:0}}>{n}</div>
      <div>
        <div style={{fontSize:13.5,fontWeight:700,letterSpacing:'-0.005em'}}>{t}</div>
        <div style={{fontSize:11,color:T.inkFaint,marginTop:1}}>{s}</div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
