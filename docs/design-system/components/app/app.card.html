<!-- @dsCard group="Components" viewport="700x400" name="Nexus App" subtitle="Scorecard, GlassCard, Money — light & dark" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="stylesheet" href="../../styles.css" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;font-family:var(--sans)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Scorecard, GlassCard, Money, Eyebrow } = window.AgencyTrackDesignSystem_ad1cd7;
function Half({ dark }) {
  const stage = dark
    ? 'radial-gradient(circle at 18% 22%, #0c3a3c 0%, transparent 44%), radial-gradient(circle at 82% 28%, #3a2f12 0%, transparent 42%), #1A1612'
    : 'radial-gradient(circle at 18% 22%, #cfeceb 0%, transparent 42%), radial-gradient(circle at 82% 30%, #f6e6c4 0%, transparent 40%), #F7F6F2';
  return (
    <div className={dark ? 'nexus dark' : 'nexus'} style={{ flex: 1, padding: 16, background: stage, display: 'flex', flexDirection: 'column', gap: 12 }}>
      <GlassCard tint={dark ? 'gold' : 'teal'}>
        <Eyebrow size="sm" color={dark ? 'var(--gold)' : undefined} star={dark}>{dark ? 'Christmas campaign' : 'YTD · Settled API'}</Eyebrow>
        <div style={{ fontFamily: 'var(--display)', fontWeight: 800, fontSize: 27, letterSpacing: '-.022em', color: 'var(--ink)', marginTop: 7 }}>
          <Money value={dark ? 70000 : 487000} mono={false} />
        </div>
        <div style={{ fontSize: 11.5, color: 'var(--inkMute)', marginTop: 4 }}>{dark ? 'persistency gate: 91% · full payout' : '81% of TTD 600K · 5 weeks left'}</div>
      </GlassCard>
      <div style={{ display: 'flex', gap: 10 }}>
        <Scorecard eyebrow="Persistency" value="88%" accent="var(--success)" />
        <Scorecard eyebrow="This week" value={<Money value={24500} mono={false} />} progress={81} />
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(
  <div style={{ display: 'flex', minHeight: 380 }}><Half dark={false} /><Half dark={true} /></div>
);
</script>
</body>
</html>
