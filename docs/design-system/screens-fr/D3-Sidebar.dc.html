<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Desktop v3 sidebar</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Onest:wght@400..800&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}a{color:inherit}*{font-variant-numeric:tabular-nums}.d3s-item{transition:background 120ms ease}.d3s-item:hover{background:rgba(127,120,105,0.14)}.d3s-scroll{scrollbar-width:thin}.d3s-sub{animation:d3sIn 260ms cubic-bezier(0.32,0.72,0,1) both}@keyframes d3sIn{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}@media (prefers-reduced-motion: reduce){*{animation-duration:1ms !important;transition-duration:1ms !important}}</style>
</helmet>
<nav aria-label="Main" style="width: 220px; height: {{h}}px; box-sizing: border-box; background: {{c.side}}; border-right: 1px solid {{c.rule}}; display: flex; flex-direction: column; font-family: 'Onest', sans-serif; color: {{c.ink}};">
  <a href="D3-Today.dc.html" onClick="{{go.Today}}" style="height: 56px; flex-shrink: 0; display: flex; align-items: center; gap: 10px; padding: 0 18px; text-decoration: none;">
    <span style="width: 28px; height: 28px; border-radius: 8px; background: {{c.accent}}; display: flex; align-items: flex-end; justify-content: center; gap: 3px; padding-bottom: 7px; box-sizing: border-box;" aria-hidden="true">
      <span style="width: 3px; height: 6px; border-radius: 2px; background: {{c.onAccent}}; opacity: 0.6;"></span>
      <span style="width: 3px; height: 10px; border-radius: 2px; background: {{c.onAccent}}; opacity: 0.8;"></span>
      <span style="width: 3px; height: 14px; border-radius: 2px; background: {{c.onAccent}};"></span>
    </span>
    <span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 17px; font-weight: 700; letter-spacing: -0.02em;">AgencyTrack</span>
  </a>

  <div class="d3s-scroll" style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 0 10px 8px; display: flex; flex-direction: column;">
    <sc-for list="{{items}}" as="it" hint-placeholder-count="13">
      <sc-if value="{{it.hasHead}}" hint-placeholder-val="{{false}}">
        <span style="height: 26px; flex-shrink: 0; display: flex; align-items: flex-end; padding: 0 10px 4px; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; font-weight: 600; letter-spacing: 0.08em; color: {{c.faint}};">{{it.head}}</span>
      </sc-if>
      <a class="d3s-item" href="{{it.href}}" onClick="{{it.go}}" aria-current="{{it.current}}" style="height: 44px; flex-shrink: 0; display: flex; align-items: center; gap: 11px; padding: 0 10px; border-radius: 10px; background: {{it.bg}}; color: {{it.color}}; font-size: 14px; font-weight: {{it.weight}}; text-decoration: none; box-shadow: {{it.shadow}};">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
        <span style="flex-grow: 1;">{{it.label}}</span>
        <sc-if value="{{it.hasBadge}}" hint-placeholder-val="{{false}}"><span style="min-width: 22px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 10px; background: {{it.badgeBg}}; color: {{it.badgeFg}}; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center;">{{it.badge}}</span></sc-if>
        <sc-if value="{{it.hasSubs}}" hint-placeholder-val="{{false}}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="transform: {{it.chev}}; transition: transform 200ms ease; opacity: 0.6;"><path d="M9 6l6 6-6 6"></path></svg></sc-if>
      </a>
      <sc-if value="{{it.open}}" hint-placeholder-val="{{false}}">
        <div class="d3s-sub" style="display: flex; flex-direction: column; margin: 2px 0 4px 20px; padding-left: 10px; border-left: 1px solid {{c.rule}};">
          <sc-for list="{{it.subs}}" as="s" hint-placeholder-count="4">
            <a class="d3s-item" href="{{it.href}}" onClick="{{s.go}}" aria-current="{{s.current}}" style="height: 44px; flex-shrink: 0; display: flex; align-items: center; padding: 0 10px; border-radius: 8px; font-size: 13px; font-weight: {{s.weight}}; color: {{s.color}}; text-decoration: none;">{{s.label}}</a>
          </sc-for>
        </div>
      </sc-if>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; padding: 10px; border-top: 1px solid {{c.rule}}; display: flex; flex-direction: column; gap: 6px;">
    <a href="D2-Report.dc.html" onClick="{{go.Report}}" style="min-height: 48px; border-radius: 12px; background: {{reportBg}}; padding: 6px 12px; display: flex; align-items: center; gap: 10px; text-decoration: none; box-sizing: border-box;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{c.accent}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{reportIcon}}"></path></svg>
      <span style="display: flex; flex-direction: column; gap: 1px;"><span style="font-size: 13px; font-weight: 700; color: {{c.accent}};">{{reportTitle}}</span><span style="font-size: 12px; color: {{c.mute}};">{{reportSub}}</span></span>
    </a>
    <a href="D3-Trophies.dc.html" onClick="{{go.Trophies}}" style="min-height: 48px; display: flex; align-items: center; gap: 10px; padding: 4px 6px; border-radius: 10px; text-decoration: none; box-sizing: border-box;">
      <span style="width: 36px; height: 36px; flex-shrink: 0;"><dc-import name="D3-Trophy" kind="level-pro" size="36" dark="{{dark}}" hint-size="36px,36px"></dc-import></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 4px;">
        <span style="display: flex; justify-content: space-between; align-items: baseline;"><span style="font-size: 13px; font-weight: 700;">Kyron · Pro</span><span style="font-size: 11px; color: {{c.mute}};">2,940 pts</span></span>
        <span role="img" aria-label="560 points to Elite" style="height: 4px; border-radius: 2px; background: {{c.rule}};"><span style="display: block; width: 72%; height: 4px; border-radius: 2px; background: {{c.gold}};"></span></span>
      </span>
    </a>
  </div>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["Today","Calls","Week","Pipeline","Numbers","Ledger","Money","Arena","Campaign","Awards","Trophies","Me","Connections"],"default":"Today"},"tab":{"editor":"string","default":""},"dark":{"editor":"boolean","default":false},"h":{"editor":"int","default":900},"reportDone":{"editor":"boolean","default":false},"onNav":{"editor":null},"$preview":{"width":220,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const light = { side: '#EFEBE2', ink: '#1F1D1A', mute: '#5A544A', faint: '#6B6558', rule: '#E2DCD0', accent: '#0B5D5E', onAccent: '#FFFFFF', accentTint: '#DCEAE7', warm: '#A63D1A', surface: '#FFFFFF', gold: '#B07A10' };
    const dark = { side: '#181816', ink: '#F2EFE8', mute: '#BDB6A8', faint: '#A39C8E', rule: '#2C2A26', accent: '#63C5BF', onAccent: '#0D1B1A', accentTint: '#16312F', warm: '#F29066', surface: '#26241F', gold: '#E8B44E' };
    const c = this.props.dark ? dark : light;
    const FILES = { Today: 'D3-Today', Calls: 'D3-Focus', Week: 'D2-Week', Pipeline: 'D3-Pipeline', Numbers: 'D3-Numbers', Ledger: 'D3-Ledger', Money: 'D3-Money', Arena: 'D2-Arena', Campaign: 'D3-Campaign', Awards: 'D3-Awards', Trophies: 'D3-Trophies', Me: 'D2-Me', Connections: 'D3-Connections', Report: 'D2-Report' };
    const goTo = (t) => (e) => { if (this.props.onNav) { e.preventDefault(); this.props.onNav(t); } };
    const I = {
      Today: 'M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v2M12 21v2M4.2 4.2l1.4 1.4M18.4 18.4l1.4 1.4M1 12h2M21 12h2M4.2 19.8l1.4-1.4M18.4 5.6l1.4-1.4',
      Calls: 'M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.5c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z',
      Week: 'M5 4h14a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 9h18M8 2v4M16 2v4',
      Pipeline: 'M3 4h18l-7 8v6l-4 2v-8z',
      Numbers: 'M4 20V10M10 20V4M16 20v-7M22 20H2',
      Ledger: 'M6 3h12a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2zM8 8h8M8 12h8M8 16h5',
      Money: 'M2 6h20v13H2zM12 15.5a3 3 0 1 0 0-6 3 3 0 0 0 0 6z',
      Arena: 'M4 20h4v-7H4zM10 20h4V8h-4zM16 20h4v-10h-4z',
      Campaign: 'M4 22V4M4 4h13l-2 4 2 4H4',
      Awards: 'M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 14 7 22l5-3 5 3-1.5-8',
      Trophies: 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3',
      Me: 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0',
      Connections: 'M9 17H7a5 5 0 0 1 0-10h2M15 7h2a5 5 0 0 1 0 10h-2M8 12h8'
    };
    const SUBS = {
      Calls: [['Calls', 'Calls', 'mode'], ['Winback', 'Win-back', 'mode'], ['Paperwork', 'Paperwork', 'mode']],
      Pipeline: [['Funnel', 'Funnel', 'view'], ['Board', 'Board', 'view']],
      Numbers: [['Scorecard', 'Scorecard'], ['Production', 'Production report'], ['Sources', 'Call sources'], ['History', 'History']],
      Money: [['Overview', 'Overview'], ['Goals', 'Goals and MDRT'], ['GamePlan', 'Game plan'], ['MoneyNeeds', 'Money needs'], ['Commission', 'Commission'], ['Persistency', 'Persistency'], ['Financing', 'Financing']]
    };
    const def = [
      ['Today', 'Today', '', 'WORK'], ['Calls', 'Focus', '12', ''], ['Week', 'Week', '', ''], ['Pipeline', 'Pipeline', '', ''],
      ['Numbers', 'Numbers', '', 'NUMBERS'], ['Ledger', 'Policy ledger', '1', ''],
      ['Money', 'Money', '', 'MONEY'],
      ['Arena', 'Leaderboard', '7th', 'COMPETE'], ['Campaign', 'Christmas campaign', '', ''], ['Awards', 'Awards', '', ''], ['Trophies', 'Trophy room', '', ''],
      ['Me', 'Me', '', 'YOU'], ['Connections', 'Connections', '', '']
    ];
    const active = this.props.active || 'Today';
    const tab = this.props.tab || '';
    const items = def.map((d) => {
      const on = d[0] === active;
      const warm = d[0] === 'Ledger';
      const gold = d[0] === 'Arena';
      const subsDef = SUBS[d[0]] || [];
      const firstTab = subsDef.length ? subsDef[0][0] : '';
      const subs = subsDef.map((s) => {
        const sOn = on && (tab ? tab === s[0] : s[0] === firstTab);
        return { label: s[1], go: goTo(d[0] + '?' + (s[2] || 'tab') + '=' + s[0]), current: sOn ? 'page' : 'false', weight: sOn ? 700 : 500, color: sOn ? c.accent : c.mute };
      });
      return {
        label: d[1], icon: I[d[0]], href: FILES[d[0]] + '.dc.html', go: goTo(d[0]),
        current: on ? 'page' : 'false', bg: on ? c.surface : 'transparent', color: on ? c.accent : c.ink,
        weight: on ? 700 : 500, shadow: on ? '0 1px 2px rgba(0,0,0,0.08)' : 'none',
        hasBadge: !!d[2], badge: d[2], badgeBg: warm ? c.warm : (gold ? c.gold : c.accentTint), badgeFg: warm || gold ? '#FFFFFF' : c.accent,
        hasHead: !!d[3], head: d[3],
        hasSubs: subsDef.length > 0, open: on && subsDef.length > 0, subs: subs, chev: on ? 'rotate(90deg)' : 'none'
      };
    });
    const done = !!this.props.reportDone;
    return {
      c: c, items: items, h: this.props.h || 900, dark: !!this.props.dark,
      go: { Today: goTo('Today'), Report: goTo('Report'), Trophies: goTo('Trophies') },
      reportBg: done ? c.accentTint : c.surface,
      reportIcon: done ? 'M20 6 9 17l-5-5' : 'M4 3h16v18H4zM8 8h8M8 12h8M8 16h5',
      reportTitle: done ? 'Week 39 locked in' : 'Week 39 report due',
      reportSub: done ? '13-week streak' : 'Today · about 1 min'
    };
  }
}
</script>
</body>
</html>
